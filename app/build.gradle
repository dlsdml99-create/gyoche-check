plugins { id 'com.android.application' }
def run = (System.getenv('RUN_NUMBER') ?: '1').toInteger()
android {
    namespace 'com.gyoche.check'
    compileSdk 34
    defaultConfig {
        applicationId 'com.gyoche.check'
        minSdk 24
        targetSdk 34
        versionCode run
        versionName "1.${run}"
        // 실제 폰(ARM)용만 넣기: 에뮬레이터용(x86) 기계어를 빼서 용량을 크게 줄임
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    signingConfigs {
        fixed {
            // 서명 키와 비밀번호는 GitHub 비밀값(GYOCHE_SIGNING)에서 빌드할 때만 꺼내 씀
            storeFile file('gyoche.jks')
            storePassword System.getenv('KEY_PASS') ?: ''
            keyAlias 'gyoche'
            keyPassword System.getenv('KEY_PASS') ?: ''
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.fixed }
        // 배포용: 디버그 기능을 빼고(더 빠름), 안 쓰는 코드·리소스를 지워 용량을 줄임
        release {
            signingConfig signingConfigs.fixed
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lint { checkReleaseBuilds false; abortOnError false }
    packagingOptions { resources { excludes += ['META-INF/*.version', 'META-INF/*.kotlin_module', 'kotlin/**', 'DebugProbesKt.bin'] } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.core:core:1.13.1'
    // 글자·바코드 인식 엔진은 폰의 Google Play 서비스에 있는 것을 빌려 씀 (앱 용량 약 60MB 절약)
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition-korean:16.0.2'
    implementation 'com.google.android.gms:play-services-mlkit-barcode-scanning:18.3.1'
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}
