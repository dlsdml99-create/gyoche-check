<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src https://api.github.com; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F4EF">
<title>챙김이</title>
<style>:root {
  --bg: #F6F4EF; --card: #FFFFFF; --ink: #1E2421; --sub: #6B726E; --line: #E6E2D9;
  --brand: #2E7D5B; --brand-soft: #E2F0E8;
  --ok: #2E9E6B; --ok-soft: #E3F4EB; --soon: #D98A0B; --soon-soft: #FDF1DC; --over: #D2453A; --over-soft: #FBE5E2;
  --food: #E07A3F; --clothes: #5B7FD6; --daily: #2E9E9E;
  --r: 16px; --shadow: 0 1px 2px rgba(30,36,33,.06), 0 4px 14px rgba(30,36,33,.05);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 15px/1.45 -apple-system, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif; min-height: 100vh; padding-bottom: 164px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
.wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }

/* 상단 */
.nz .title-row { flex-wrap: wrap; gap: 8px; } .nz .title-row > div:first-child { flex: 1 1 100%; min-width: 0; } .nz h1 { white-space: nowrap; }
.nz .carcard > .row { flex-direction: column; align-items: flex-start !important; gap: 10px; } .nz .carcard > .row .btn.pri { align-self: stretch; }
.nz .item { gap: 8px; padding: 10px; } .nz .item .ico:not(.ph) { display: none; } .nz .item .nm { white-space: normal; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.nz .season { flex-wrap: wrap; } .nz .season span:nth-child(2) { flex: 1 1 calc(100% - 40px); } .nz .season .clink { margin-left: 36px; } .nz .season .clink + .clink { margin-left: 14px; }
header.top { padding: 20px 0 8px; }
.title-row { display: flex; align-items: center; justify-content: space-between; }
h1 { font-size: 22px; margin: 0; letter-spacing: -0.4px; }
.today { color: var(--sub); font-size: 13px; }
.summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0 6px; }
.sum { background: var(--card); border-radius: 14px; padding: 10px 12px; box-shadow: var(--shadow); text-align: left; }
.sum b { display: block; font-size: 22px; line-height: 1.1; }
.sum span { font-size: 12px; color: var(--sub); }
.sum.over b { color: var(--over-t); } .sum.soon b { color: var(--soon-t); } .sum.ok b { color: var(--ok-t); }
.sum.on { outline: 2px solid var(--ink); }

/* 탭 칩 */
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 10px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 7px 13px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: 14px; white-space: nowrap; }
.chip.on { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.chip small { opacity: .7; margin-left: 3px; }

/* 목록 */
.list { display: flex; flex-direction: column; gap: 8px; }
.item { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: var(--r); padding: 12px 14px; box-shadow: var(--shadow); text-align: left; width: 100%; }
.ico { width: 40px; height: 40px; border-radius: 12px; flex: none; display: grid; place-items: center; }
.ico svg { width: 22px; height: 22px; }
.ico.food { background: var(--food-soft); color: var(--food); } .ico.clothes { background: var(--clothes-soft); color: var(--clothes); } .ico.daily { background: var(--daily-soft); color: var(--daily); }
.item .mid { flex: 1; min-width: 0; }
.item .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .meta { font-size: 12.5px; color: var(--sub); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nz .item .meta { white-space: normal; overflow-wrap: anywhere; }
.toast, .btn, .seg button, .hint, .sum b, .sum span { word-break: keep-all; overflow-wrap: anywhere; }
.bar { height: 4px; border-radius: 4px; background: var(--line); margin-top: 7px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 4px; }
.dd { flex: none; min-width: 58px; text-align: center; font-weight: 700; font-size: 14px; padding: 6px 8px; border-radius: 10px; }
.dd.ok { background: var(--ok-soft); color: var(--ok-t); } .dd.soon { background: var(--soon-soft); color: var(--soon-t); } .dd.over { background: var(--over-soft); color: var(--over-t); }
.group-h { font-size: 13px; color: var(--sub); margin: 14px 2px 2px; font-weight: 600; }

.empty { text-align: center; padding: 48px 20px; color: var(--sub); }
.empty .big { font-size: 17px; color: var(--ink); font-weight: 600; margin-bottom: 6px; }
.empty .btns { display: flex; gap: 8px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }

/* 버튼 */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 12px 16px; border-radius: 12px; font-weight: 600; background: var(--card); border: 1px solid var(--line); }
.btn.pri { background: var(--brand); color: #fff; border-color: var(--brand); }
.btn.warn { background: var(--over-soft); color: var(--over-t); border-color: transparent; }
.btn.soft { background: var(--brand-soft); color: var(--brand); border-color: transparent; }
.btn.block { width: 100%; }
.btn svg { width: 18px; height: 18px; }
.fab { position: fixed; right: max(16px, calc(50% - 264px)); bottom: 92px; width: 58px; height: 58px; border-radius: 20px; background: var(--brand); color: #fff; box-shadow: 0 6px 18px rgba(46,125,91,.35); display: grid; place-items: center; z-index: 20; }
.fab svg { width: 28px; height: 28px; }

/* 하단 탭 */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--nav-bg); backdrop-filter: blur(8px); border-top: 1px solid var(--line); display: flex; justify-content: center; z-index: 15; padding-bottom: env(safe-area-inset-bottom); }
nav.tabs button { flex: 1; max-width: 186px; padding: 9px 0 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11.5px; color: var(--sub); }
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button.on { color: var(--brand); font-weight: 700; }

/* 시트 */
.dim { position: fixed; inset: 0; background: rgba(20,24,22,.42); z-index: 40; display: flex; align-items: flex-end; justify-content: center; animation: fade .15s; }
.sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: calc(92vh / var(--z, 1)); overflow-y: auto; border-radius: 22px 22px 0 0; padding: 8px 16px calc(20px + env(safe-area-inset-bottom)); animation: up .2s ease-out; }
.sheet .grab { width: 40px; height: 4px; background: var(--grab); border-radius: 4px; margin: 4px auto 10px; }
.sheet h2 { font-size: 19px; margin: 4px 0 14px; display: flex; align-items: center; justify-content: space-between; }
.sheet h2 button { font-size: 14px; color: var(--sub); font-weight: 500; }
@keyframes up { from { transform: translateY(40px); opacity: .4; } }
@keyframes fade { from { opacity: 0; } }

.menu { display: flex; flex-direction: column; gap: 8px; }
.menu button { display: flex; align-items: center; gap: 14px; background: var(--card); border-radius: 14px; padding: 14px; text-align: left; box-shadow: var(--shadow); }
.menu button .ico { width: 42px; height: 42px; background: var(--brand-soft); color: var(--brand); }
.menu b { display: block; } .menu small { color: var(--sub); }

/* 폼 */
.field { margin-bottom: 14px; }
.field > label, .lbl { display: block; font-size: 13px; color: var(--sub); margin: 0 0 6px 2px; font-weight: 600; }
.inp { width: 100%; padding: 12px 13px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); outline: none; }
.inp:focus { border-color: var(--brand); }
.row { display: flex; gap: 8px; align-items: center; }
.row > * { min-width: 0; }
.seg { display: flex; background: var(--seg); border-radius: 12px; padding: 3px; }
.seg button { flex: 1; padding: 9px 4px; border-radius: 10px; font-size: 14px; color: var(--sub); }
.seg button.on { background: var(--card); color: var(--ink); font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.presets .chip { padding: 6px 11px; font-size: 13.5px; }
.hint { font-size: 12.5px; color: var(--sub); margin: 6px 2px 0; }
.hint b { color: var(--ink); }
.scan-row { display: flex; gap: 8px; margin-bottom: 14px; }
.scan-row .btn { flex: 1; padding: 10px; font-size: 14px; }

/* 상세 */
.hero { background: var(--card); border-radius: 18px; padding: 18px; box-shadow: var(--shadow); text-align: center; margin-bottom: 12px; }
.hero .dd { display: inline-block; font-size: 22px; padding: 8px 18px; border-radius: 14px; }
.hero .when { margin-top: 8px; color: var(--sub); font-size: 14px; }
.kv { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); margin-bottom: 12px; }
.kv div { display: flex; justify-content: space-between; padding: 11px 14px; border-bottom: 1px solid var(--line); font-size: 14px; }
.kv div:last-child { border-bottom: 0; }
.kv span { color: var(--sub); }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.actions .full { grid-column: 1 / -1; }

/* v1.31 식단표·손질 */
.mask { display: flex; flex-direction: column; gap: 8px; background: var(--soon-soft); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; font-size: 14px; }
.mask .row { display: flex; gap: 8px; } .mask .btn { flex: 1; padding: 8px; }
.mweek { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 6px; } .mweek button { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; background: var(--card); } .mweek svg { width: 18px; height: 18px; }
.mslots { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--sub); margin-bottom: 8px; } .mslots .chip { padding: 6px 10px; font-size: 13px; }
.mtable { display: grid; gap: 6px; grid-template-columns: minmax(0, 1fr); } .leftseg .seg button { white-space: nowrap; }
.mrow { display: flex; gap: 6px; align-items: stretch; } .mrow .md { flex: none; width: 46px; display: flex; flex-direction: column; justify-content: center; font-size: 12px; color: var(--sub); } .mrow .md b { font-size: 15px; color: var(--ink); }
.mrow.today .md b { color: var(--accent, #2E7D5B); } .mrow.past { opacity: .7; }
.mcell { flex: 1; min-width: 0; text-align: left; background: var(--card); border-radius: 10px; padding: 7px 9px; font-size: 14px; font-weight: 700; box-shadow: var(--shadow); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mcell small { display: block; font-size: 11px; font-weight: 400; color: var(--sub); } .mcell.empty { background: transparent; border: 1px dashed var(--line); box-shadow: none; color: var(--sub); text-align: center; font-weight: 400; }
.mcell.done { opacity: .75; } .mcell.skip { text-decoration: line-through; opacity: .6; }
.malt { margin-top: 10px; } .mlink { font-size: 14px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 4px 2px; } .mlink .clink { margin-left: auto; }
.cstbox { margin-bottom: 4px; } .cstbox .lbl { margin: 0 2px 6px; } .cstbox .seg button { white-space: nowrap; font-size: 13.5px; padding: 9px 2px; }
.hist { font-size: 13.5px; color: var(--sub); }
.hist li { padding: 3px 0; display: flex; align-items: center; gap: 8px; }
.trow { display: flex; align-items: center; } .trow label { flex: 1; } .trx { flex: none; width: 36px; height: 36px; color: var(--sub); font-size: 13px; }
.dtag { font-size: 11px; font-weight: 600; color: var(--sub); background: var(--chip, rgba(127,127,127,.12)); border-radius: 999px; padding: 1px 7px; margin-left: 4px; white-space: nowrap; }
.dishbar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 2px 2px 10px; font-size: 14px; } .dishbar .clink { margin: 0 0 0 auto; } .dishbar .clink + .clink { margin-left: 8px; }
.qstep { display: flex; gap: 8px; align-items: center; } .qstep .btn { width: 48px; flex: none; font-size: 20px; padding: 8px 0; } .qstep .inp { text-align: center; flex: 1; }
.materow { padding: 8px 0; border-bottom: 1px solid var(--line); } .materow b { display: block; margin: 0 2px 6px; font-size: 15px; } .materow .seg { margin: 0; } .materow .seg button { white-space: nowrap; font-size: 13.5px; padding: 9px 2px; }
.leftseg { display: flex; align-items: center; gap: 10px; margin: 0 0 8px; } .leftseg > span { font-size: 13px; color: var(--sub); flex: none; } .leftseg .seg { flex: 1; margin: 0; }
.pedit { float: right; margin: 0; font-weight: 400; }
.sgc { display: inline-flex; align-items: stretch; }
.sgk { flex-basis: 100%; font-size: 12px; color: var(--sub); margin: 6px 2px 0; }
.sgc .chip { border-top-right-radius: 0; border-bottom-right-radius: 0; margin-right: 0; }
.sgc .sgx { border: 1px solid var(--line); border-left: 0; background: var(--card); color: var(--sub); border-radius: 0 999px 999px 0; padding: 0 11px; font-size: 13px; min-width: 34px; }
.prdel { margin: 0; font-size: 12px; }
.hist .evdel { margin: 0 0 0 auto; font-size: 12px; padding: 4px 2px; }
.links { display: flex; justify-content: center; gap: 22px; margin-top: 8px; }
.links button { color: var(--sub); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }

/* 영수증 확인 */
.rc { display: flex; gap: 10px; align-items: flex-start; background: var(--card); border-radius: 14px; padding: 11px 12px; margin-bottom: 8px; box-shadow: var(--shadow); }
.rc input[type=checkbox] { width: 22px; height: 22px; margin: 9px 0 0; accent-color: var(--brand); flex: none; }
.rc .mid { flex: 1; min-width: 0; }
.rc .inp { padding: 8px 10px; }
.rc .sub { display: flex; gap: 6px; margin-top: 6px; align-items: center; font-size: 12.5px; color: var(--sub); flex-wrap: wrap; }
.rc select, .rc input[type=date] { padding: 5px 6px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); font-size: 12.5px; }
.rc.off { opacity: .55; }
details.more summary { color: var(--sub); font-size: 13.5px; margin: 12px 2px 8px; cursor: pointer; }

/* 통계 */
.month-nav { display: flex; align-items: center; justify-content: space-between; margin: 6px 0 12px; }
.month-nav b { font-size: 18px; }
.month-nav button { width: 38px; height: 38px; border-radius: 12px; background: var(--card); box-shadow: var(--shadow); display: grid; place-items: center; }
.month-nav button:disabled { opacity: .35; }
.stat-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.sc { background: var(--card); border-radius: 16px; padding: 14px; box-shadow: var(--shadow); }
.sc .k { font-size: 13px; color: var(--sub); }
.sc .v { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; margin-top: 2px; }
.sc .v small { font-size: 14px; font-weight: 600; color: var(--sub); margin-left: 2px; }
.sc .d { font-size: 12.5px; margin-top: 2px; }
.up { color: var(--over-t); } .down { color: var(--ok-t); } .same { color: var(--sub); }
.panel { background: var(--card); border-radius: 16px; padding: 14px; box-shadow: var(--shadow); margin-bottom: 10px; }
.panel h3 { font-size: 15px; margin: 0 0 12px; }
.trend { display: flex; align-items: flex-end; gap: 10px; height: 140px; padding-top: 8px; }
.trend .col { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; gap: 4px; }
.trend .bars { display: flex; gap: 3px; align-items: flex-end; height: 100px; }
.trend .bars i { width: 12px; border-radius: 4px 4px 0 0; min-height: 2px; position: relative; }
.trend .n { font-size: 10.5px; color: var(--sub); height: 13px; }
.trend .m { font-size: 11.5px; color: var(--sub); }
.trend .col.cur .m { color: var(--ink); font-weight: 700; }
.legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--sub); margin-top: 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.hbar { display: flex; align-items: center; gap: 10px; margin: 8px 0; font-size: 13.5px; }
.hbar .l { width: 52px; color: var(--sub); }
.hbar .t { flex: 1; height: 10px; background: var(--bg); border-radius: 6px; overflow: hidden; }
.hbar .t i { display: block; height: 100%; border-radius: 6px; }
.hbar .n { width: 28px; text-align: right; font-weight: 700; }
.log li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.log li:last-child { border-bottom: 0; }
.log .tag { font-size: 12px; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
.tag.discard { background: var(--over-soft); color: var(--over-t); } .tag.eaten { background: var(--ok-soft); color: var(--ok-t); } .tag.replace { background: var(--clothes-soft); color: var(--clothes); }
ul { list-style: none; padding: 0; margin: 0; }

/* 설정 */
.set { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); margin-bottom: 12px; }
.set > div { display: flex; align-items: center; justify-content: space-between; padding: 14px; border-bottom: 1px solid var(--line); gap: 10px; }
.set > div:last-child { border-bottom: 0; }
.set small { display: block; color: var(--sub); font-size: 12.5px; }
.sw { position: relative; width: 50px; height: 30px; flex: none; }
.sw input { opacity: 0; width: 0; height: 0; }
.sw i { position: absolute; inset: 0; background: var(--grab); border-radius: 30px; transition: .2s; }
.sw i::after { content: ''; position: absolute; width: 24px; height: 24px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.sw input:checked + i { background: var(--brand); }
.sw input:checked + i::after { transform: translateX(20px); }
.sec-h { font-size: 13px; color: var(--sub); font-weight: 700; margin: 18px 4px 8px; }

/* 토스트·로딩 */
.toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: rgba(30,36,33,.92); color: #fff; padding: 11px 16px; border-radius: 12px; font-size: 14px; z-index: 60; max-width: calc(100% - 32px); text-align: center; animation: fade .2s; }
.busy { position: fixed; inset: 0; background: var(--veil); z-index: 70; display: grid; place-items: center; }
.busy div { background: var(--card); padding: 18px 22px; border-radius: 16px; box-shadow: var(--shadow); display: flex; gap: 12px; align-items: center; font-weight: 600; }
.spin { width: 22px; height: 22px; border: 3px solid var(--brand-soft); border-top-color: var(--brand); border-radius: 50%; animation: rot .8s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }
.hidden { display: none !important; }

/* 탭 구조 추가분 */
:root { --car: #7A5BD6; }
.ico.car { background: var(--car-soft); color: var(--car); }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--sub); background: var(--card); box-shadow: var(--shadow); flex: none; }
.icon-btn svg { width: 22px; height: 22px; }
.title-row h1 + .today, .title-row div .today { margin-top: 2px; }
.strip { width: 100%; display: flex; justify-content: space-between; align-items: center; background: var(--card); border-radius: 14px; padding: 11px 14px; box-shadow: var(--shadow); font-size: 14px; margin: 4px 0 2px; color: var(--ink); }
.strip svg { color: var(--sub); width: 20px; height: 20px; flex: none; }
.strip span svg { vertical-align: -4px; margin-right: 4px; }
.dd.long { min-width: 74px; font-size: 13px; }
.hint.center { text-align: center; margin: 16px 8px 0; line-height: 1.6; }
nav.tabs button { max-width: 120px; }
nav.tabs .ni { position: relative; display: inline-block; height: 24px; }
nav.tabs .dot { position: absolute; top: -4px; right: -10px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 9px; background: var(--over); color: #fff; font-size: 10.5px; font-weight: 700; line-height: 16px; text-align: center; }
nav.tabs button[data-v=food].on { color: var(--food); }
nav.tabs button[data-v=clothes].on { color: var(--clothes); }
nav.tabs button[data-v=daily].on { color: var(--daily); }
nav.tabs button[data-v=car].on { color: var(--car); }
.carcard { background: linear-gradient(135deg, #3A2E6B, #5A45A8); color: #fff; border-radius: 20px; padding: 16px; margin: 12px 0 8px; box-shadow: 0 6px 18px rgba(90,69,168,.25); }
.carcard .cname { font-size: 14px; opacity: .85; }
.carcard .ckm { font-size: clamp(22px, 7.5vw, 30px); font-weight: 800; letter-spacing: -0.5px; white-space: nowrap; }
.carcard .ckm small { font-size: 15px; font-weight: 600; margin-left: 3px; opacity: .8; }
.carcard .btn.pri { background: #fff; color: #3A2E6B; border-color: #fff; padding: 10px 12px; font-size: 14px; }
.carcard .cmeta { font-size: 12.5px; opacity: .85; margin-top: 8px; }
.carcard .cwarn { background: rgba(255,212,92,.2); color: #FFE08A; border-radius: 10px; padding: 8px 10px; font-size: 13px; margin-top: 10px; }

/* ── 다크 모드 ── */
:root { --on-ink: #FFFFFF; --food-soft: #FBE9DD; --clothes-soft: #E4EAF8; --daily-soft: #DDF1F1; --car-soft: #ECE6FA; --dday: #CC4F7A; --dday-soft: #FAE3EC; --nav-bg: rgba(255,255,255,.96); --grab: #CFCAC0; --seg: #EAE6DD; --veil: rgba(246,244,239,.9); }

  --bg: #151917; --card: #1F2421; --ink: #EAEEEB; --sub: #9DA59F; --line: #2F3632;
  --brand: #4FAE83; --brand-soft: #1D3328;
  --ok: #5CC593; --ok-soft: #183327; --soon: #F0B04A; --soon-soft: #3A2D12; --over: #F07468; --over-soft: #3D1F1C;

  --nav-bg: rgba(26,30,28,.96); --grab: #3A423E; --seg: #2A302D; --veil: rgba(21,25,23,.88);
  --shadow: 0 1px 2px rgba(0,0,0,.35);
}

.medp { background: var(--card); border-radius: 16px; padding: 12px; margin: 0 0 12px; display: flex; flex-wrap: wrap; gap: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }

.rfav { display: inline-flex; align-items: center; gap: 4px; margin: -4px 0 10px; padding: 6px 12px; border-radius: 999px; border: 1.5px solid var(--line); background: transparent; color: inherit; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; } .rfav svg { width: 15px; height: 15px; } .rfav.on { border-color: #E8B931; color: #B78A00; }

.ico.dday { background: var(--dday-soft); color: var(--dday); }

  // ── 자동차 ──

  // 같은 물건끼리 비교하려고 묶는 이름 ("서울우유 1L"과 "매일우유 900ml"는 둘 다 우유)

  function compareKey(name) {

  // ══ D-day: 구독 · 약정 · 기념일 ══
  var SUBS = ['넷플릭스', '유튜브 프리미엄', '쿠팡 와우', '티빙', '디즈니+', '웨이브', '네이버플러스', '배민클럽', '멜론', '밀리의 서재'];

  function addMonths(s, n) {

  }

  function ddayInfo(it, today, nth) {

  // 음력 날짜 → 그해 양력 날짜 (한국 음력 'dangi'), 윤달은 평달 기준, 30일이 없는 달은 29일

  // ══ 다 떨어질 날 예측: 산 날짜 간격의 평균 ══
  function runout(hist, today) {

  // ══ 0원 도전: 음식을 하나도 안 버린 달 ══
  function zeroChallenge(events, today) {

    var first = food.reduce(function (m, e) { return e.date.slice(0, 7) < m ? e.date.slice(0, 7) : m; }, cur);
    var bad = {}; food.forEach(function (e) { if (e.type === 'discard') bad[e.date.slice(0, 7)] = (bad[e.date.slice(0, 7)] || 0) + 1; });
    var streak = 0, best = 0, run = 0, months = [];

    months.forEach(function (ym) { if (!bad[ym]) { run++; best = Math.max(best, run); } else run = 0; });
    streak = run;
    return { cur: bad[cur] || 0, curOk: !bad[cur], streak: streak, best: best, started: true, last: months.length ? months[months.length - 1] : null, lastOk: months.length ? !bad[months[months.length - 1]] : false };
  }

  // ══ 1년 결산 ══
  function yearStats(events, year, rate) {

  // ══ 말로 등록: "우유 두 개 이마트에서 오천구백 원 그리고 두부 하나" ══
  var SINO = { '일': 1, '이': 2, '삼': 3, '사': 4, '오': 5, '육': 6, '칠': 7, '팔': 8, '구': 9 };

  var NATIVE = [['열두', 12], ['열한', 11], ['스무', 20], ['다섯', 5], ['여섯', 6], ['일곱', 7], ['여덟', 8], ['아홉', 9], ['하나', 1], ['한', 1], ['둘', 2], ['두', 2], ['셋', 3], ['세', 3], ['넷', 4], ['네', 4], ['열', 10]];

  function parseVoice(text, today) {
    var t = String(text || '').replace(/,(?=\d{3})/g, '');

    var store = null;

  // ══ v1.8 ══

  function monthSpend(prices, ym, rate) {

  // 계기판 사진 글자에서 주행거리 고르기
  function parseOdometer(lines, prevKm, rate, lastDate, today) {
    var cands = [];

    var exp = null;

    } else cands.forEach(function (c) { c.sc += c.km >= 1000 ? 1 : 0; });
    cands.sort(function (a, b) { return b.sc - a.sc || b.km - a.km; });

    return { km: uniq[0].km, line: uniq[0].line, alts: uniq.slice(1, 4).map(function (c) { return c.km; }) };
  }

  // 검색: 이름·메모·산 곳·보관 위치, 초성(ㅇㅇ → 우유)도
  var CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';

  function recommend(items, today, opts) {
    opts = opts || {};
    var own = {}; // 재료 → [{it, left}]
    items.forEach(function (it) {
      if (it.cat !== 'food') return;
      var left = G.diffDays(G.itemDue(it), today);

      ingredientsOf(it.name).forEach(function (k) { (own[k] = own[k] || []).push({ it: it, left: left }); });

    openSheet(h, function (el) {

  // ── 가격·구매처·단가 ──
  function won(x) { return x < 10 ? (Math.round(x * 10) / 10).toString() : num(x); }

  // ── 화폐: 원·달러 (설정의 기본 화폐·달러 환율·화폐 같이 보기) ──
  // 금액은 넣은 화폐 그대로 저장(cur:'USD', 없으면 원) → 보여줄 때 기본 화폐로 바꾸고, 같이 보기를 켜면 다른 화폐도 괄호로
  function fx() { var r = +S.set.rate; return { main: S.set.cur === 'USD' ? 'USD' : 'KRW', rate: r > 0 ? r : G.DEFAULT_RATE, both: !!S.set.curBoth }; }
  function fxRate() { return fx().rate; }
  function usd(v) {
    var a = Math.abs(+v || 0), r = Math.round(a * 100) / 100, s;
    if (!a) s = '0';
    else if (r >= 1000) s = num(r);
    else if (a >= 1) { s = r.toFixed(2); if (/\.00$/.test(s)) s = s.slice(0, -3); }
    else if (a >= 0.1) s = r.toFixed(2);
    else if (a >= 0.01) s = String(Math.round(a * 1000) / 1000);
    else s = String(+a.toPrecision(2));
    return (v < 0 ? '-' : '') + '$' + s;
  }
  function inCur(v, cur) { return cur === 'USD' ? usd(v) : won(v) + '원'; }
  function otherCur(c) { return c === 'USD' ? 'KRW' : 'USD'; }
  function money(v, cur, solo) {
    var f = fx(), c = cur === 'USD' ? 'USD' : 'KRW', k = G.toKRW(v, c, f.rate);

  // ════════ 옷: 오늘 입은 옷 (지난주와 안 겹치게) ════════
  var WEAR_LOCS = ['상의', '하의'];
  function wearItems() {
    return S.items.filter(function (x) { return x.cat === 'clothes' && WEAR_LOCS.indexOf(x.loc) >= 0; });
  }
  function wornOn(d) {
    var ids = S.wear[d] || [];
    return ids.filter(function (id) { return S.items.some(function (x) { return x.id === id; }); });
  }
  function toggleWear(d, id) {
    var a = (S.wear[d] || []).slice(), i = a.indexOf(id);
    if (i >= 0) a.splice(i, 1); else a.push(id);
    setWear(d, a);
  }
  function setWear(d, ids) {
    if (ids.length) S.wear[d] = ids; else delete S.wear[d];
    if (d === today()) S.items.forEach(function (x) { if (x.cst && ids.indexOf(x.id) >= 0) setCst(x, ''); }); // 입었으면 다시 옷장에 있는 걸로
    // 1년 넘은 기록은 정리 (용량 절약)
    var cut = G.addDays(today(), -400);
    Object.keys(S.wear).forEach(function (k) { if (k < cut) delete S.wear[k]; });
    persist();
  }
  // d 날 이전에 마지막으로 입은 날
  function lastWorn(id, d) {
    var ks = Object.keys(S.wear).filter(function (k) { return k < d && S.wear[k].indexOf(id) >= 0; }).sort();
    return ks.length ? ks[ks.length - 1] : null;
  }
  function dayWord(d) {
    var t = today(), n = G.diffDays(t, d);
    var w = DPW[G.parseYmd(d).getDay()];
    return n === 0 ? '오늘' : n === 1 ? '어제' : n < 7 ? w + '요일' : md(d) + ' ' + w;
  }
  var wearYm = null;
  function wearRepeat(d) {
    return wornOn(d).some(function (id) { var l = lastWorn(id, d); return l && G.diffDays(d, l) < 7; });
  }
  function nameOf(id) { var x = S.items.filter(function (i) { return i.id === id; })[0]; return x ? x.name : ''; }
  function wThumb(id) { return PH[id] ? '<img alt="" decoding="async" src="' + PH[id] + '">' : IC.clothes; }
  function wearPanel(t) {
    var items = wearItems();
    if (!items.length) {
      return '<button class="strip" data-act="wphoto"><span>' + IC.cam + ' 상의·하의를 사진으로 등록하면 <b>날마다 입은 옷</b>을 달력으로 기록해요</span>' + IC.right + '</button>';
    }
    var open = !!S.set.wearOpen, now = wornOn(t);

    if (now.length) {
      h += '<span class="wb-ic">' + now.slice(0, 2).map(function (id) { return PH[id] ? '<img alt="" src="' + PH[id] + '">' : '<i>' + IC.clothes + '</i>'; }).join('') + '</span>';
      var rep = now.some(function (id) { var l = lastWorn(id, t); return l && G.diffDays(t, l) < 7; });
      h += '<span class="wb-t"><b>오늘</b> ' + esc(now.map(nameOf).join(' · ')) + (rep ? '<small style="color:var(--soon-t)">이번 주에 입은 옷</small>' : '') + '</span>';
    } else {
      h += '<span class="wb-t"><b>오늘 입은 옷</b><small>기록하기 · 달력</small></span>';
    }
    h += IC.down + '</button>';
    if (open) h += '<div class="wear-body">' + wearCal(t) + '</div>';
    return h + '</div>';
  }
  function wearCal(t) {
    var ym = wearYm || t.slice(0, 7);
    var y = +ym.slice(0, 4), m = +ym.slice(5, 7);
    var first = new Date(y, m - 1, 1), days = new Date(y, m, 0).getDate();
    var pad = function (n) { return (n < 10 ? '0' : '') + n; };
    var minYm = G.addDays(t, -400).slice(0, 7);
    var h = '<div class="wcal-h"><button data-wym="-1" aria-label="지난달"' + (ym <= minYm ? ' disabled' : '') + '><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>' +
      '<b>' + y + '년 ' + m + '월</b><button data-wym="1" aria-label="다음 달"' + (ym >= t.slice(0, 7) ? ' disabled' : '') + '>' + IC.right + '</button></div>';
    h += '<div class="wcal">' + DPW.map(function (w, k) { return '<span class="wh' + (k ? '' : ' sun') + '">' + w + '</span>'; }).join('');
    for (var k = 0; k < first.getDay(); k++) h += '<button class="out" disabled aria-hidden="true"></button>';
    var monthIds = {}, recDays = 0, repDays = 0;
    for (var dn = 1; dn <= days; dn++) {
      var d = ym + '-' + pad(dn), ids = wornOn(d), fut = d > t;
      if (ids.length) { recDays++; ids.forEach(function (id) { monthIds[id] = (monthIds[id] || 0) + 1; }); }
      var rp = ids.length && wearRepeat(d);
      if (rp) repDays++;
      h += '<button data-wday="' + d + '"' + (fut ? ' disabled' : '') + ' class="' + (d === t ? 'td' : '') + '" aria-label="' + m + '월 ' + dn + '일' + (ids.length ? ' ' + esc(ids.map(nameOf).join(', ')) : ' 기록 없음') + '">' +
        '<span class="dn">' + dn + '</span>' +
        (ids.length ? '<span class="ths' + (ids.length === 1 ? ' one' : '') + '">' + ids.slice(0, 2).map(function (id) { return '<span>' + wThumb(id) + '</span>'; }).join('') + '</span>' : '') +
        (ids.length > 2 ? '<span class="more">+' + (ids.length - 2) + '</span>' : '') +
        (rp ? '<span class="rp" title="7일 안에 또 입은 옷"></span>' : '') + '</button>';
    }
    h += '</div>';

    if (recDays) sum += '<div><span>이달 안 입은 옷</span><span>' + (none.length ? esc(none.slice(0, 3).map(function (x) { return x.name; }).join(' · ')) + (none.length > 3 ? ' 외 ' + (none.length - 3) + '벌' : '') : '없어요 · 골고루 입었어요') + '</span></div>';
    h += '<div class="wsum">' + sum + '</div>';
    var wl = washList();
    if (wl.length) h += '<div class="wash">🧺<span>세탁할 옷 <b>' + wl.length + '벌</b> · ' + esc(wl.slice(0, 3).map(function (x) { return x.name; }).join(', ')) + (wl.length > 3 ? ' 외' : '') + '</span><button class="btn" data-washall>모두 세탁했어요</button></div>';
    var td = tidyList();
    if (td.length) h += '<button class="tidy" data-tidy><span>' + TIDY_DAYS / 30 + '달 넘게 안 입은 옷 <b>' + td.length + '벌</b> · 정리할까요?</span>' + IC.right + '</button>';
    h += '<button class="btn pri block" data-wday="' + t + '" style="margin-top:10px">' + (wornOn(t).length ? '오늘 입은 옷 바꾸기' : '오늘 입은 옷 고르기') + '</button>';
    return h;
  }
  // 날짜별 고르기 화면
  function openWear(d, picked) {
    var t = today();
    var items = wearItems();
    if (!items.length) { doAct('wphoto'); return; }
    var sel = picked || wornOn(d).slice();
    function info(it) {
      var l = lastWorn(it.id, d);
      var gap = l ? G.diffDays(d, l) : null;

  // ── 아이 옷 사이즈 ──
  function kidHint(k) {
    var t = today(), m = k.at ? Math.floor(G.diffDays(t, k.at) / 30) : null, tips = [];
    if (m != null && m >= 6) tips.push({ w: 1, t: m + '달 전에 잰 사이즈예요. 키를 다시 재 볼 때예요' });
    if (k.h && k.top && k.h >= k.top) tips.push({ w: 1, t: '키(' + k.h + 'cm)가 상의 ' + k.top + '에 꽉 차요 · 다음은 ' + (Math.floor(k.h / 10) * 10 + 10) + ' 추천' });
    if (k.h && k.bottom && k.h >= k.bottom) tips.push({ w: 1, t: '하의 ' + k.bottom + '도 작아질 때예요 · 다음은 ' + (Math.floor(k.h / 10) * 10 + 10) + ' 추천' });
    var lg = (k.log || []).slice().sort(function (a, b) { return a.d < b.d ? -1 : 1; });
    if (lg.length >= 2) { var a = lg[0], b = lg[lg.length - 1], mo = Math.max(1, Math.round(G.diffDays(b.d, a.d) / 30)); if (b.h > a.h) tips.push({ w: 0, t: mo + '달 동안 ' + (Math.round((b.h - a.h) * 10) / 10) + 'cm 컸어요' }); }
    return tips;
  }
  function kidsDue() { return (S.kids || []).some(function (k) { return kidHint(k).some(function (x) { return x.w; }); }); }

    // 연비: 가득 넣은 날부터 다음 가득 넣은 날까지 달린 km ÷ 그 사이 넣은 리터 (최근 5구간)
    var dist = 0, lit = 0, seg = 0, fulls = [];
    F.forEach(function (f, i) { if (f.full && f.km) fulls.push(i); });
    for (var j = fulls.length - 1; j >= 1 && seg < 5; j--) {
      var a = fulls[j - 1], b = fulls[j], d = F[b].km - F[a].km, L = 0, good = d > 0;
      for (var k = a + 1; k <= b; k++) { if (!F[k].l) { good = false; break; } L += F[k].l; } // 사이에 리터를 안 적은 주유가 있으면 그 구간은 빼요
      if (good && L > 0 && d / L < 60) { dist += d; lit += L; seg++; }
    }
    if (lit > 0) r.eff = Math.round(dist / lit * 10) / 10;
    // 1km당 기름값: 주행거리를 적은 첫 주유 다음부터 마지막으로 적은 주유까지 넣은 돈(금액만 적은 주유 포함) ÷ 달린 거리
    var ki = []; F.forEach(function (f, i) { if (f.km) ki.push(i); });
    if (ki.length >= 2 && F[ki[ki.length - 1]].km > F[ki[0]].km) { var won = 0; for (var m = ki[0] + 1; m <= ki[ki.length - 1]; m++) won += F[m].won; r.perKm = Math.round(won / (F[ki[ki.length - 1]].km - F[ki[0]].km)); }
    return r;
  }

      : bk.locked ? '<p class="hint">🔒 비밀번호가 걸린 백업이에요.</p><div class="row"><input class="pw" id="bk-upw" type="password" autocomplete="off" maxlength="40" placeholder="백업 비밀번호" aria-label="백업 비밀번호"><button class="btn main" type="button" data-bk="unlock"' + (bk.busy ? ' disabled' : '') + '>열기</button><button class="btn" type="button" data-bk="cancel">취소</button></div>'
      : '<p class="hint">폰을 바꾸거나 앱을 지우기 전에 파일로 저장해 두세요. 파일은 내가 고른 곳에만 저장되고 인터넷으로 보내지 않아요.</p>' +
        (BLOCK.ok() ? '<input class="pw" id="bk-pw" type="password" autocomplete="new-password" maxlength="40" placeholder="비밀번호 (선택, 8글자 이상)" aria-label="비밀번호 (선택, 8글자 이상) · 넣으면 잠가요">' : '') +
        '<div class="row"><button class="btn" type="button" data-bk="save"' + (bk.busy ? ' disabled' : '') + '>백업 파일로 저장</button><button class="btn" type="button" data-bk="open"' + (bk.busy ? ' disabled' : '') + '>백업 불러오기</button></div>') +
      (bk.msg ? '<p class="hint" role="status">' + esc(bk.msg) + '</p>' : '');
  }
  function render() {
    var up = hasUpdate();
    var notes = (C.notes || []).map(function (n) {
      var v = n.v === 'current' ? 'v' + cur() : n.v;
      return '<li><div class="nh"><b>' + esc(v) + '</b><span>' + esc(n.d || '') + '</span></div><ul>' +
        (n.items || []).map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul></li>';
    }).join('');
    var dk = document.documentElement.getAttribute('data-theme') === 'dark' || (!document.documentElement.getAttribute('data-theme') && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    root.innerHTML = '<style>' + CSS + '</style><div class="w' + (dk ? ' dk' : '') + '"><div class="scrim" data-x></div>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(C.name) + ' 앱 정보" tabindex="-1">' +
      '<div class="grab"></div><div class="head"><h2>' + esc(C.name) + '<span class="vtag' + (up ? ' up' : '') + '">v' + esc(cur()) + '</span></h2>' +
      '<button class="x" type="button" data-x aria-label="닫기">×</button></div>' +
      '<p class="msg">' + statusHTML() + '</p>' +
      '<div class="row">' + (up && latest.url ? '<a class="btn main" href="' + esc(latest.url) + '" target="_blank" rel="noopener">업데이트 받기</a>' : '') +
      (C.online ? '<button class="btn" type="button" data-chk' + (checking ? ' disabled' : '') + '>새 버전 확인</button>' : '') + '</div>' +
      bkHTML() +
      '<p class="lbl">업데이트 내용</p><ul class="notes">' + notes + '</ul>' +
      '<p class="lbl">개인정보</p><p class="hint">' + esc(C.privacy || '') + '</p></div></div>';
    root.querySelectorAll('[data-x]').forEach(function (b) { b.addEventListener('click', close); });
    var c = root.querySelector('[data-chk]');
    if (c) c.addEventListener('click', function () { check(true); });
    root.querySelectorAll('[data-bk]').forEach(function (b) { b.addEventListener('click', function () { var k = b.getAttribute('data-bk'); if (k === 'save') bkSave(); else if (k === 'open') bkOpen(); else if (k === 'apply') bkApply(); else if (k === 'unlock') bkUnlock(); else { bk.pending = null; bk.locked = null; bkSet(''); } }); });
  }
  function open() { isOpen = true; host.style.display = 'block'; render(); var sh = root.querySelector('.sheet'); if (sh) sh.focus(); if (C.online && !checking && (!latest || Date.now() - (latest.at || 0) > 600000)) check(false); }
  function close() { isOpen = false; host.style.display = 'none'; root.innerHTML = ''; try { label.focus(); } catch (e) { /* 무시 */ } }
  document.addEventListener('keydown', function (e) { if (isOpen && e.key === 'Escape') close(); });
  /* 뒤로 가기 키: 창이 열려 있으면 창부터 닫음 (앱이 나중에 onBackKey를 바꿔도 유지) */
  var prevBack = window.onBackKey;
  Object.defineProperty(window, 'onBackKey', { configurable: true, get: function () { return wrapped; }, set: function (f) { prevBack = f; } });
  function wrapped() { if (isOpen) { close(); return true; } return typeof prevBack === 'function' ? prevBack.apply(this, arguments) : false; }

  function check(manual) {
    if (!C.online || checking) return;
    checking = true; failed = false; if (isOpen) render();
    var done = function () { checking = false; paint(); if (isOpen) render(); };
    fetch('https://api.github.com/repos/' + C.repo + '/releases/latest', { headers: { Accept: 'application/vnd.github+json' }, cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('http'); return r.json(); })
      .then(function (j) {
        // 보안: 이 앱 저장소의 릴리스 주소만 받음
        var pre = 'https://github.com/' + C.repo + '/releases/', okU = function (u) { return typeof u === 'string' && u.indexOf(pre) === 0 && !/[\s"'<>]/.test(u); };
        var url = okU(j.html_url) ? j.html_url : pre + 'latest';
        (j.assets || []).forEach(function (a) { if (/\.apk$/i.test(a.name) && okU(a.browser_download_url)) url = a.browser_download_url; });
        if (j.tag_name) { latest = { v: norm(j.tag_name), url: url, at: Date.now() }; try { localStorage.setItem(KEY, JSON.stringify(latest)); } catch (e) { /* 무시 */ } }
        done();
      })
      .catch(function () { failed = true; done(); });
  }
  /* 폰(앱)이 확인한 최신 버전을 알려줄 때 */
  function native(v) { if (v) { latest = { v: norm(v), url: (latest && latest.url) || ('https://github.com/' + C.repo + '/releases/latest'), at: Date.now() }; try { localStorage.setItem(KEY, JSON.stringify(latest)); } catch (e) { /* 무시 */ } paint(); } }

  window.AppInfo = { open: open, check: check, native: native, refresh: paint,
    backupDone: function (ok, why) { bkDone(!!ok, why); }, backupOpened: function (t) { bkOpened(t); } };
  paint();
  if (C.online && (!latest || Date.now() - (latest.at || 0) > 6 * 3600000)) setTimeout(function () { check(false); }, 1500);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && C.online && latest && Date.now() - (latest.at || 0) > 6 * 3600000) check(false); });
})();
</script><!--/APPINFO-->
</body></html>
