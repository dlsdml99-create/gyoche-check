<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F4EF">
<title>챙김이</title>
<style>:root {
  --bg: #F6F4EF; --card: #FFFFFF; --ink: #1E2421; --sub: #6B726E; --line: #E6E2D9;
  --brand: #2E7D5B; --brand-soft: #E2F0E8;
  --ok: #2E9E6B; --ok-soft: #E3F4EB; --soon: #D98A0B; --soon-soft: #FDF1DC; --over: #D2453A; --over-soft: #FBE5E2;
  --food: #E07A3F; --clothes: #5B7FD6; --daily: #2E9E9E;
  --r: 16px; --shadow: 0 1px 2px rgba(30,36,33,.06), 0 4px 14px rgba(30,36,33,.05);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 15px/1.45 -apple-system, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif; min-height: 100vh; padding-bottom: 84px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
.wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }

/* 상단 */
header.top { padding: 20px 0 8px; }
.title-row { display: flex; align-items: center; justify-content: space-between; }
h1 { font-size: 22px; margin: 0; letter-spacing: -0.4px; }
.today { color: var(--sub); font-size: 13px; }
.summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0 6px; }
.sum { background: var(--card); border-radius: 14px; padding: 10px 12px; box-shadow: var(--shadow); text-align: left; }
.sum b { display: block; font-size: 22px; line-height: 1.1; }
.sum span { font-size: 12px; color: var(--sub); }
.sum.over b { color: var(--over); } .sum.soon b { color: var(--soon); } .sum.ok b { color: var(--ok); }
.sum.on { outline: 2px solid var(--ink); }

/* 탭 칩 */
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 10px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 7px 13px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: 14px; white-space: nowrap; }
.chip.on { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.chip small { opacity: .7; margin-left: 3px; }

/* 목록 */
.list { display: flex; flex-direction: column; gap: 8px; }
.item { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: var(--r); padding: 12px 14px; box-shadow: var(--shadow); text-align: left; width: 100%; }
.ico { width: 40px; height: 40px; border-radius: 12px; flex: none; display: grid; place-items: center; }
.ico svg { width: 22px; height: 22px; }
.ico.food { background: var(--food-soft); color: var(--food); } .ico.clothes { background: var(--clothes-soft); color: var(--clothes); } .ico.daily { background: var(--daily-soft); color: var(--daily); }
.item .mid { flex: 1; min-width: 0; }
.item .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .meta { font-size: 12.5px; color: var(--sub); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { height: 4px; border-radius: 4px; background: var(--line); margin-top: 7px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 4px; }
.dd { flex: none; min-width: 58px; text-align: center; font-weight: 700; font-size: 14px; padding: 6px 8px; border-radius: 10px; }
.dd.ok { background: var(--ok-soft); color: var(--ok); } .dd.soon { background: var(--soon-soft); color: var(--soon); } .dd.over { background: var(--over-soft); color: var(--over); }
.group-h { font-size: 13px; color: var(--sub); margin: 14px 2px 2px; font-weight: 600; }

.empty { text-align: center; padding: 48px 20px; color: var(--sub); }
.empty .big { font-size: 17px; color: var(--ink); font-weight: 600; margin-bottom: 6px; }
.empty .btns { display: flex; gap: 8px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }

/* 버튼 */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 12px 16px; border-radius: 12px; font-weight: 600; background: var(--card); border: 1px solid var(--line); }
.btn.pri { background: var(--brand); color: #fff; border-color: var(--brand); }
.btn.warn { background: var(--over-soft); color: var(--over); border-color: transparent; }
.btn.soft { background: var(--brand-soft); color: var(--brand); border-color: transparent; }
.btn.block { width: 100%; }
.btn svg { width: 18px; height: 18px; }
.fab { position: fixed; right: max(16px, calc(50% - 264px)); bottom: 92px; width: 58px; height: 58px; border-radius: 20px; background: var(--brand); color: #fff; box-shadow: 0 6px 18px rgba(46,125,91,.35); display: grid; place-items: center; z-index: 20; }
.fab svg { width: 28px; height: 28px; }

/* 하단 탭 */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--nav-bg); backdrop-filter: blur(8px); border-top: 1px solid var(--line); display: flex; justify-content: center; z-index: 15; padding-bottom: env(safe-area-inset-bottom); }
nav.tabs button { flex: 1; max-width: 186px; padding: 9px 0 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11.5px; color: var(--sub); }
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button.on { color: var(--brand); font-weight: 700; }

/* 시트 */
.dim { position: fixed; inset: 0; background: rgba(20,24,22,.42); z-index: 40; display: flex; align-items: flex-end; justify-content: center; animation: fade .15s; }
.sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: calc(92vh / var(--z, 1)); overflow-y: auto; border-radius: 22px 22px 0 0; padding: 8px 16px calc(20px + env(safe-area-inset-bottom)); animation: up .2s ease-out; }
.sheet .grab { width: 40px; height: 4px; background: var(--grab); border-radius: 4px; margin: 4px auto 10px; }
.sheet h2 { font-size: 19px; margin: 4px 0 14px; display: flex; align-items: center; justify-content: space-between; }
.sheet h2 button { font-size: 14px; color: var(--sub); font-weight: 500; }
@keyframes up { from { transform: translateY(40px); opacity: .4; } }
@keyframes fade { from { opacity: 0; } }

.menu { display: flex; flex-direction: column; gap: 8px; }
.menu button { display: flex; align-items: center; gap: 14px; background: var(--card); border-radius: 14px; padding: 14px; text-align: left; box-shadow: var(--shadow); }
.menu button .ico { width: 42px; height: 42px; background: var(--brand-soft); color: var(--brand); }
.menu b { display: block; } .menu small { color: var(--sub); }

/* 폼 */
.field { margin-bottom: 14px; }
.field > label, .lbl { display: block; font-size: 13px; color: var(--sub); margin: 0 0 6px 2px; font-weight: 600; }
.inp { width: 100%; padding: 12px 13px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); outline: none; }
.inp:focus { border-color: var(--brand); }
.row { display: flex; gap: 8px; align-items: center; }
.row > * { min-width: 0; }
.seg { display: flex; background: var(--seg); border-radius: 12px; padding: 3px; }
.seg button { flex: 1; padding: 9px 4px; border-radius: 10px; font-size: 14px; color: var(--sub); }
.seg button.on { background: var(--card); color: var(--ink); font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.presets .chip { padding: 6px 11px; font-size: 13.5px; }
.hint { font-size: 12.5px; color: var(--sub); margin: 6px 2px 0; }
.hint b { color: var(--ink); }
.scan-row { display: flex; gap: 8px; margin-bottom: 14px; }
.scan-row .btn { flex: 1; padding: 10px; font-size: 14px; }

/* 상세 */
.hero { background: var(--card); border-radius: 18px; padding: 18px; box-shadow: var(--shadow); text-align: center; margin-bottom: 12px; }
.hero .dd { display: inline-block; font-size: 22px; padding: 8px 18px; border-radius: 14px; }
.hero .when { margin-top: 8px; color: var(--sub); font-size: 14px; }
.kv { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); margin-bottom: 12px; }
.kv div { display: flex; justify-content: space-between; padding: 11px 14px; border-bottom: 1px solid var(--line); font-size: 14px; }
.kv div:last-child { border-bottom: 0; }
.kv span { color: var(--sub); }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.actions .full { grid-column: 1 / -1; }
.hist { font-size: 13.5px; color: var(--sub); }
.hist li { padding: 3px 0; }
.links { display: flex; justify-content: center; gap: 22px; margin-top: 8px; }
.links button { color: var(--sub); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }

/* 영수증 확인 */
.rc { display: flex; gap: 10px; align-items: flex-start; background: var(--card); border-radius: 14px; padding: 11px 12px; margin-bottom: 8px; box-shadow: var(--shadow); }
.rc input[type=checkbox] { width: 22px; height: 22px; margin: 9px 0 0; accent-color: var(--brand); flex: none; }
.rc .mid { flex: 1; min-width: 0; }
.rc .inp { padding: 8px 10px; }
.rc .sub { display: flex; gap: 6px; margin-top: 6px; align-items: center; font-size: 12.5px; color: var(--sub); flex-wrap: wrap; }
.rc select, .rc input[type=date] { padding: 5px 6px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); font-size: 12.5px; }
.rc.off { opacity: .55; }
details.more summary { color: var(--sub); font-size: 13.5px; margin: 12px 2px 8px; cursor: pointer; }

/* 통계 */
.month-nav { display: flex; align-items: center; justify-content: space-between; margin: 6px 0 12px; }
.month-nav b { font-size: 18px; }
.month-nav button { width: 38px; height: 38px; border-radius: 12px; background: var(--card); box-shadow: var(--shadow); display: grid; place-items: center; }
.month-nav button:disabled { opacity: .35; }
.stat-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.sc { background: var(--card); border-radius: 16px; padding: 14px; box-shadow: var(--shadow); }
.sc .k { font-size: 13px; color: var(--sub); }
.sc .v { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; margin-top: 2px; }
.sc .v small { font-size: 14px; font-weight: 600; color: var(--sub); margin-left: 2px; }
.sc .d { font-size: 12.5px; margin-top: 2px; }
.up { color: var(--over); } .down { color: var(--ok); } .same { color: var(--sub); }
.panel { background: var(--card); border-radius: 16px; padding: 14px; box-shadow: var(--shadow); margin-bottom: 10px; }
.panel h3 { font-size: 15px; margin: 0 0 12px; }
.trend { display: flex; align-items: flex-end; gap: 10px; height: 140px; padding-top: 8px; }
.trend .col { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; gap: 4px; }
.trend .bars { display: flex; gap: 3px; align-items: flex-end; height: 100px; }
.trend .bars i { width: 12px; border-radius: 4px 4px 0 0; min-height: 2px; position: relative; }
.trend .n { font-size: 10.5px; color: var(--sub); height: 13px; }
.trend .m { font-size: 11.5px; color: var(--sub); }
.trend .col.cur .m { color: var(--ink); font-weight: 700; }
.legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--sub); margin-top: 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.hbar { display: flex; align-items: center; gap: 10px; margin: 8px 0; font-size: 13.5px; }
.hbar .l { width: 52px; color: var(--sub); }
.hbar .t { flex: 1; height: 10px; background: var(--bg); border-radius: 6px; overflow: hidden; }
.hbar .t i { display: block; height: 100%; border-radius: 6px; }
.hbar .n { width: 28px; text-align: right; font-weight: 700; }
.log li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.log li:last-child { border-bottom: 0; }
.log .tag { font-size: 12px; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
.tag.discard { background: var(--over-soft); color: var(--over); } .tag.eaten { background: var(--ok-soft); color: var(--ok); } .tag.replace { background: var(--clothes-soft); color: var(--clothes); }
ul { list-style: none; padding: 0; margin: 0; }

/* 설정 */
.set { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); margin-bottom: 12px; }
.set > div { display: flex; align-items: center; justify-content: space-between; padding: 14px; border-bottom: 1px solid var(--line); gap: 10px; }
.set > div:last-child { border-bottom: 0; }
.set small { display: block; color: var(--sub); font-size: 12.5px; }
.sw { position: relative; width: 50px; height: 30px; flex: none; }
.sw input { opacity: 0; width: 0; height: 0; }
.sw i { position: absolute; inset: 0; background: var(--grab); border-radius: 30px; transition: .2s; }
.sw i::after { content: ''; position: absolute; width: 24px; height: 24px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.sw input:checked + i { background: var(--brand); }
.sw input:checked + i::after { transform: translateX(20px); }
.sec-h { font-size: 13px; color: var(--sub); font-weight: 700; margin: 18px 4px 8px; }

/* 토스트·로딩 */
.toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: rgba(30,36,33,.92); color: #fff; padding: 11px 16px; border-radius: 12px; font-size: 14px; z-index: 60; max-width: calc(100% - 32px); text-align: center; animation: fade .2s; }
.busy { position: fixed; inset: 0; background: var(--veil); z-index: 70; display: grid; place-items: center; }
.busy div { background: var(--card); padding: 18px 22px; border-radius: 16px; box-shadow: var(--shadow); display: flex; gap: 12px; align-items: center; font-weight: 600; }
.spin { width: 22px; height: 22px; border: 3px solid var(--brand-soft); border-top-color: var(--brand); border-radius: 50%; animation: rot .8s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }
.hidden { display: none !important; }

/* 탭 구조 추가분 */
:root { --car: #7A5BD6; }
.ico.car { background: var(--car-soft); color: var(--car); }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--sub); background: var(--card); box-shadow: var(--shadow); flex: none; }
.icon-btn svg { width: 22px; height: 22px; }
.title-row h1 + .today, .title-row div .today { margin-top: 2px; }
.strip { width: 100%; display: flex; justify-content: space-between; align-items: center; background: var(--card); border-radius: 14px; padding: 11px 14px; box-shadow: var(--shadow); font-size: 14px; margin: 4px 0 2px; color: var(--ink); }
.strip svg { color: var(--sub); }
.dd.long { min-width: 74px; font-size: 13px; }
.hint.center { text-align: center; margin: 16px 8px 0; line-height: 1.6; }
nav.tabs button { max-width: 120px; }
nav.tabs .ni { position: relative; display: inline-block; height: 24px; }
nav.tabs .dot { position: absolute; top: -4px; right: -10px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 9px; background: var(--over); color: #fff; font-size: 10.5px; font-weight: 700; line-height: 16px; text-align: center; }
nav.tabs button[data-v=food].on { color: var(--food); }
nav.tabs button[data-v=clothes].on { color: var(--clothes); }
nav.tabs button[data-v=daily].on { color: var(--daily); }
nav.tabs button[data-v=car].on { color: var(--car); }
.carcard { background: linear-gradient(135deg, #3A2E6B, #5A45A8); color: #fff; border-radius: 20px; padding: 16px; margin: 12px 0 8px; box-shadow: 0 6px 18px rgba(90,69,168,.25); }
.carcard .cname { font-size: 14px; opacity: .85; }
.carcard .ckm { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; }
.carcard .ckm small { font-size: 15px; font-weight: 600; margin-left: 3px; opacity: .8; }
.carcard .btn.pri { background: #fff; color: #3A2E6B; border-color: #fff; padding: 10px 12px; font-size: 14px; }
.carcard .cmeta { font-size: 12.5px; opacity: .85; margin-top: 8px; }
.carcard .cwarn { background: rgba(255,212,92,.2); color: #FFE08A; border-radius: 10px; padding: 8px 10px; font-size: 13px; margin-top: 10px; }
.carcard .clink { color: #fff; opacity: .8; }
.clink { font-size: 13px; text-decoration: underline; text-underline-offset: 3px; color: var(--sub); margin-top: 8px; padding: 0; }
.rc b { font-weight: 600; }

/* 웹 미리보기 안내 띠 */
.pv { display: flex; gap: 10px; align-items: center; justify-content: space-between; background: #1E2421; color: #F6F4EF; font-size: 12.5px; line-height: 1.4; padding: 8px max(16px, env(safe-area-inset-left, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
.pv b { color: #FFD45C; }
.pv button { flex: none; color: #1E2421; background: #FFD45C; border-radius: 8px; padding: 6px 10px; font-size: 12.5px; font-weight: 700; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .sheet, .dim, .toast { animation: none; } .spin { animation-duration: 2s; } }

.mascot { width: 92px; height: 92px; margin: 0 auto 10px; }
.mascot svg { width: 100%; height: 100%; display: block; }
.mascot.sm { width: 40px; height: 40px; margin: 0; display: inline-block; }
.brand { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 22px; font-size: 16px; }

/* 사진 */
.ico.ph { position: relative; padding: 0; overflow: visible; background: var(--line); }
.ico.ph img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; display: block; }
.ico.ph i { position: absolute; right: -4px; bottom: -4px; width: 18px; height: 18px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--card); }
.ico.ph i svg { width: 11px; height: 11px; }
.photo-row { display: flex; gap: 10px; align-items: center; }
.pthumb { width: 56px; height: 56px; border-radius: 12px; object-fit: cover; flex: none; }
.pthumb.empty { display: grid; place-items: center; background: var(--card); border: 1px dashed var(--line); color: var(--sub); }
.pthumb.empty svg { width: 22px; height: 22px; }
.pbig { background: #111; border-radius: 16px; overflow: hidden; display: grid; place-items: center; min-height: 200px; }
.pbig img { max-width: 100%; max-height: calc(62vh / var(--z, 1)); display: block; }
.dphoto { display: block; width: 100%; padding: 0; margin-bottom: 12px; border-radius: 16px; overflow: hidden; background: var(--line); }
.dphoto img { width: 100%; max-height: 220px; object-fit: cover; display: block; }

/* 요리 추천 */
.rec { background: var(--card); border-radius: 16px; padding: 12px 14px; box-shadow: var(--shadow); margin-top: 8px; }
.rec-h { display: flex; align-items: center; gap: 8px; }
.rec-h .ri { width: 28px; height: 28px; border-radius: 9px; background: var(--food-soft); color: var(--food); display: grid; place-items: center; flex: none; }
.rec-h .ri svg { width: 18px; height: 18px; }
.rec-list { display: flex; gap: 8px; overflow-x: auto; margin-top: 10px; padding-bottom: 2px; scrollbar-width: none; }
.rec-list::-webkit-scrollbar { display: none; }
.rec-list.col { flex-direction: column; overflow: visible; }
.rcard { flex: none; width: 200px; text-align: left; background: var(--bg); border-radius: 12px; padding: 10px 12px; display: grid; gap: 3px; }
.rec-list.col .rcard { width: 100%; background: var(--card); box-shadow: var(--shadow); }
.rname { font-weight: 700; }
.rmeta { font-size: 12.5px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rtags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
.rtag { font-size: 11.5px; font-weight: 700; padding: 2px 7px; border-radius: 999px; }
.rtag.ok { background: var(--ok-soft); color: var(--ok); } .rtag.miss { background: var(--line); color: var(--sub); } .rtag.urg { background: var(--soon-soft); color: var(--soon); }
.rsteps { margin: 0 0 0 20px; padding: 0; display: grid; gap: 8px; font-size: 15px; }
.used { display: grid; gap: 6px; }
.urow { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 12px; padding: 10px 12px; box-shadow: var(--shadow); }
.urow input { width: 20px; height: 20px; accent-color: var(--brand); flex: none; }
.urow span:nth-child(2) { flex: 1; min-width: 0; }

/* 왼쪽 아래 버전 */
.ver { position: fixed; left: max(10px, env(safe-area-inset-left, 0px)); bottom: calc(64px + env(safe-area-inset-bottom, 0px)); z-index: 14; font-size: 11px; color: var(--sub); background: var(--veil); border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; }
.ver b { font-weight: 700; color: var(--ink); }
.ver .ok { color: var(--ok); font-weight: 700; } .ver .new { color: var(--soon); font-weight: 700; }
.ver.has-new { border-color: var(--soon); }

/* ── v1.3: 장보기·계절·팁·넓은 통계 카드 ── */
.hbtns { display: flex; gap: 8px; }
.icon-btn { position: relative; }
.bdg { position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--over); color: #fff; font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; }

  // ── 날짜 글자 읽기 ──
  // 줄들에서 날짜를 모두 찾는다: [{date, line, idx}]

  function findDates(lines, today) {
    var out = [];

      var line = fixOcr(raw);

  function parseReceipt(lines, today) {

  // ── 상태 ──
  function itemDue(it, car, today) {
    if (it.mode === 'car') return carStatus(it, car || {}, today || ymd(new Date())).due;
    if (it.mode === 'dday') return ddayInfo(it, today || ymd(new Date())).due;
    return it.mode === 'cycle' ? addDays(it.start, it.days) : it.due;

  // ── 자동차 ──
  function fmtKm(n) { return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',') + 'km'; }
  // 주행거리 기록으로 하루 평균 주행 km (2주 이상 기록이 쌓여야 계산)
  function kmRate(car) {
    var log = (car && car.log || []).slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : a.km - b.km; });
    if (log.length < 2) return null;
    var a = log[0], b = log[log.length - 1];
    var days = diffDays(b.date, a.date);
    if (days < 14 || b.km <= a.km) return null;
    return (b.km - a.km) / days;

  function carStatus(it, car, today) {

    var dateDue = it.intDays ? addDays(it.lastDate, it.intDays) : null;
    var rate = kmRate(car);
    var kmDue = kmLeft != null && rate ? addDays(today, Math.floor(kmLeft / rate)) : null;
    var due = dateDue && kmDue ? (dateDue < kmDue ? dateDue : kmDue) : (dateDue || kmDue);
    var left = due ? diffDays(due, today) : null;
    var kmFrac = kmLeft != null ? (curKm - it.lastKm) / it.intKm : null;
    var dFrac = it.intDays ? diffDays(today, it.lastDate) / it.intDays : null;
    var alertKm = it.alertKm == null ? 1000 : it.alertKm, alertD = it.alert == null ? 30 : it.alert;

    if (byKm) label = kmLeft >= 0 ? fmtKm(kmLeft) : '+' + fmtKm(-kmLeft);

    else label = '기록 필요';

      left: sortLeft, state: over ? 'over' : soon ? 'soon' : 'ok', label: label, byKm: byKm,
      kmLeft: kmLeft, kmUrgent: (kmLeft != null && (kmLeft < 0 || kmSoon)),
      dateDue: dateDue, kmDue: kmDue, due: due, days: left, frac: frac, rate: rate,

  function status(it, today, car) {
    if (it.mode === 'car') return carStatus(it, car || {}, today);
    if (it.mode === 'dday') {
      var f = ddayInfo(it, today);
      if (f.done) return { left: 99999, state: 'ok', label: it.kind === 'warranty' ? '보증 끝' : '지남', info: f };
      var l = diffDays(f.due, today);
      return { left: l, state: l < 0 ? 'over' : l <= f.alert ? 'soon' : 'ok', label: f.over ? '끝남' : l === 0 ? 'D-day' : l > 0 ? 'D-' + l : 'D+' + (-l), info: f };
    }
    var left = diffDays(itemDue(it), today);
    var s = left < 0 ? 'over' : left <= (it.alert == null ? 3 : it.alert) ? 'soon' : 'ok';
    return { left: left, state: s, label: left === 0 ? 'D-day' : left > 0 ? 'D-' + left : 'D+' + (-left) };

  // 오늘 알릴 목록 (앱 안 미리보기와 안드로이드 알림이 같은 규칙)
  function dueToday(items, today, car) {
    return items.map(function (it) { return { it: it, s: status(it, today, car) }; })
      .filter(function (x) { return x.s.state !== 'ok'; })
      .sort(function (a, b) { return a.s.left - b.s.left; });
  }

  // ── 통계 ──
  function monthKey(s) { return String(s).slice(0, 7); }
  function monthStats(events, ym) {
    var r = { ym: ym, discard: 0, eaten: 0, replace: 0, byCat: { food: 0, clothes: 0, daily: 0, car: 0, dday: 0 }, list: [], top: [], wasteWon: 0, wastePriced: 0, carWon: 0, cancel: 0, savedWon: 0 };
    var cnt = {};
    events.forEach(function (e) {
      if (monthKey(e.date) !== ym) return;
      r[e.type] = (r[e.type] || 0) + 1;
      if (e.type !== 'eaten') r.byCat[e.cat] = (r.byCat[e.cat] || 0) + 1;
      r.list.push(e);
      if (e.type === 'discard') cnt[e.name] = (cnt[e.name] || 0) + 1;
      if (e.type === 'discard' && e.price) { r.wasteWon += e.price; r.wastePriced++; }
      if (e.cat === 'car' && e.type === 'replace' && e.price) r.carWon += e.price;
      if (e.type === 'cancel' && e.price) r.savedWon += e.price;
    });
    r.list.sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : (b.at || 0) - (a.at || 0); });
    r.top = Object.keys(cnt).map(function (k) { return { name: k, n: cnt[k] }; }).sort(function (a, b) { return b.n - a.n; }).slice(0, 3);
    var foodDone = r.discard + r.eaten;

  function shiftMonth(ym, n) {
    var y = +ym.slice(0, 4), m = +ym.slice(5, 7) - 1 + n;

  // ══ 수량·용량·단가 ══
  // 이름에서 용량·무게·개수 읽기: "서울우유 1L" → 1000ml, "신라면 5입" → 5개, "생수 500ml 20입" → 10000ml

  // 단가: 가격 ÷ (용량 × 수량) → 100g/100ml 또는 1개당

  // ══ D-day: 구독 · 약정 · 기념일 ══

  var SINO = { '일': 1, '이': 2, '삼': 3, '사': 4, '오': 5, '육': 6, '칠': 7, '팔': 8, '구': 9 };

        }

      var dm = p.match(/\s(?:유통기한|소비기한|기한)?\s*(\d{1,2})\s*월\s*(\d{1,2})\s*일\s*(?:까지)?/);
      if (dm) {

  }

  // ══ 가족 공유: 받은 목록 합치기 (같은 물건은 더 나중에 고친 쪽, 지운 물건은 지운 시각 비교) ══
  var CATS_OK = { food: 1, clothes: 1, daily: 1, car: 1, dday: 1 };
  function cleanItem(it) {
    if (!it || typeof it !== 'object' || typeof it.id !== 'string' || typeof it.name !== 'string') return null;
    if (!CATS_OK[it.cat] || it.id.length > 40 || it.name.length > 100) return null;
    var o = {};
    Object.keys(it).forEach(function (k) {
      var v = it[k];
      if (/^(__proto__|constructor|prototype)$/.test(k) || k.length > 20) return;
      if (typeof v === 'string' && v.length <= 300) o[k] = v;
      else if (typeof v === 'number' && isFinite(v)) o[k] = v;
      else if (typeof v === 'boolean') o[k] = v;
    });
    return o;
  }
  function parseFamily(text) {
    var i = String(text || '').indexOf('GYOFAM1:');

    var body = String(text).slice(i + 8).trim();
    var end = body.lastIndexOf('}');
    if (end < 0) return null;
    try { var o = JSON.parse(body.slice(0, end + 1)); } catch (e) { return null; }
    if (!o || o.v !== 1 || !Array.isArray(o.items)) return null;
    return {
      v: 1, from: typeof o.from === 'string' ? o.from.slice(0, 20) : '', at: +o.at || 0, cats: Array.isArray(o.cats) ? o.cats.filter(function (c) { return CATS_OK[c] || c === 'shop'; }) : [],
      items: o.items.slice(0, 2000).map(cleanItem).filter(Boolean),
      del: o.del && typeof o.del === 'object' ? Object.keys(o.del).slice(0, 5000).reduce(function (m, k) { if (typeof k === 'string' && k.length <= 40 && isFinite(+o.del[k])) m[k] = +o.del[k]; return m; }, {}) : {},
      events: Array.isArray(o.events) ? o.events.slice(0, 3000).map(function (e) { return e && typeof e.id === 'string' && typeof e.name === 'string' && typeof e.type === 'string' && typeof e.date === 'string' ? cleanItem(Object.assign({}, e, { cat: CATS_OK[e.cat] ? e.cat : 'food' })) : null; }).filter(Boolean) : [],
      shop: Array.isArray(o.shop) ? o.shop.slice(0, 300).filter(function (x) { return x && typeof x.id === 'string' && typeof x.name === 'string' && x.name.length <= 100; }).map(function (x) { return { id: x.id, name: x.name, cat: CATS_OK[x.cat] ? x.cat : 'food', from: 'family', at: typeof x.at === 'string' ? x.at : '' }; }) : null,
      prices: Array.isArray(o.prices) ? o.prices.slice(0, 400).map(function (r) { return r && typeof r.id === 'string' && typeof r.name === 'string' && isFinite(+r.price) ? cleanItem(Object.assign({}, r, { cat: CATS_OK[r.cat] ? r.cat : 'food' })) : null; }).filter(Boolean) : [],

      }, {}) : {},

    };
  }
  function famMerge(L, inc) {
    var r = { added: 0, updated: 0, removed: 0, events: 0, shop: 0, barcodes: 0 };
    var del = Object.assign({}, L.del || {});
    Object.keys(inc.del || {}).forEach(function (k) { del[k] = Math.max(del[k] || 0, inc.del[k]); });
    var byId = {}; L.items.forEach(function (it) { byId[it.id] = it; });

    if (inc.shop) {
      var names = {}; shop.forEach(function (x) { if (!x.done) names[String(x.name).replace(/\s/g, '')] = 1; });
      inc.shop.forEach(function (x) { var k = String(x.name).replace(/\s/g, ''); if (names[k]) return; names[k] = 1; shop.push(x); r.shop++; });

    var prIds = {}; (L.prices || []).forEach(function (x) { prIds[x.id] = 1; });
    var prices = (L.prices || []).concat(inc.prices.filter(function (x) { return !prIds[x.id]; })).slice(-400);
    var car = L.car;
    if (inc.car) {
      if (!car || car.km == null) car = inc.car;
      else {
        var lg = {}; (car.log || []).concat(inc.car.log).forEach(function (l) { lg[l.date] = Math.max(lg[l.date] || 0, l.km); });

      }
    }
    var barcodes = Object.assign({}, L.barcodes || {});
    Object.keys(inc.barcodes || {}).forEach(function (k) { if (!barcodes[k]) { barcodes[k] = inc.barcodes[k]; r.barcodes++; } });
    return { items: items, del: del, events: events, shop: shop, prices: prices, car: car, barcodes: barcodes, stats: r };
  }

  // ══ v1.8 ══
  // 공유한 주문 내역 글(쿠팡·컬리 등)에서 산 물건 찾기
  var ORDER_SKIP = /(배송|도착|주문번호|주문일|주문 ?상세|결제|장바구니|리뷰|교환|반품|취소|구매 ?확정|판매자|문의|쿠폰|적립|할인|상품금액|배송비|로켓|새벽|오늘출발|더보기|자세히|옵션|수량 ?변경|다시 ?담기|무료|합계|총 ?결제|총 ?금액|받는 ?분|연락처|주소|요청사항|영수증|카드|포인트|전체|선택|고객센터|사업자)/;
  function parseOrder(text, today) {
    var raw = String(text || '').slice(0, 20000).replace(/https?:\/\/\S+/g, ' ');
    var lines = raw.split(/\r?\n/).map(function (l) { return l.replace(/\s+/g, ' ').trim(); }).filter(Boolean);
    var store = null, sm = raw.match(STORES); if (sm) store = sm[1];
    var dates = findDates(lines, today).filter(function (c) { var g = diffDays(c.date, today); return g <= 1 && g >= -60; });
    var buy = dates.length ? dates[0].date : today;
    var items = [], last = null, seen = {};
    lines.forEach(function (l) {
      l = l.replace(/\[[^\]]*\]|【[^】]*】/g, ' ').replace(/\s+/g, ' ').trim();
      if (!l) return;
      var pOnly = l.match(/^(?:[₩\\]\s*)?(\d{1,3}(?:,\d{3})+|\d{3,7})\s*원?$/);
      if (pOnly) { if (last && !last.price) { var v = +pOnly[1].replace(/,/g, ''); if (v >= 100 && v <= 2000000) last.price = v; } return; }
      if (ORDER_SKIP.test(l) || /주문|구매일/.test(l) || findDates([l], today).length || STORES.test(l) && l.replace(STORES, '').trim().length < 3) return;

      if ((name.match(/[가-힣]/g) || []).length < 2) return;
      var key = name.replace(/\s/g, ''); if (seen[key]) return; seen[key] = 1;
      var g = guess(name), it = { raw: l, name: name, matched: !!g, qty: qty > 1 ? qty : 1 };
      if (price && price >= 100) it.price = price;
      var am = parseAmount(name); if (am) { it.amt = am.amt; it.unit = am.unit; }

        it.cat = g.cat; it.mode = g.mode; it.loc = g.loc;

  }

  // 장보기 가계부: 그 달에 산 기록(가격 넣은 것)
  function monthSpend(prices, ym) {
    var r = { ym: ym, total: 0, n: 0, byStore: [], byCat: { food: 0, daily: 0, clothes: 0 } };
    var st = {};
    (prices || []).forEach(function (p) {
      if (String(p.date).slice(0, 7) !== ym || !(p.price > 0)) return;
      r.total += p.price; r.n++;
      var k = p.store || '가게 모름'; st[k] = (st[k] || 0) + p.price;

    });
    r.byStore = Object.keys(st).map(function (k) { return { store: k, won: st[k] }; }).sort(function (a, b) { return b.won - a.won; });
    return r;
  }

  // 안 쓰는 구독 찾기: 결제 3일 전에 "이번 달 썼어요?" 묻고, 2달 연속 안 쓰면 해지 추천
  function subUsage(it, today) {

    return { ask: left >= 0 && left <= 3 && use[ym] == null, ym: ym, left: left, due: f.due, rec: rec, unused: unused, monthly: f.monthly };
  }

  // 계기판 사진 글자에서 주행거리 고르기
  function parseOdometer(lines, prevKm, rate, lastDate, today) {
    var cands = [];
    (lines || []).forEach(function (raw) {
      var l = fixOcr(String(raw));
      var trip = /trip|구간|평균|연비|주행 ?가능|range|dte|°|℃|:\d\d|\d\.\d/i.test(l);
      var odo = /odo|총 ?주행|km|㎞|키로/i.test(l);
      var re = /(\d{1,3}(?:[,. ]\d{3})+|\d{3,7})(?![\d.]*\s*(?:°|℃|%|원))/g, m;
      while ((m = re.exec(l))) {
        var v = +m[1].replace(/[,. ]/g, '');
        if (!(v >= 100 && v <= 2000000)) continue;
        var sc = 0;
        if (odo) sc += 3;

        if (trip && !/odo/i.test(l)) sc -= 6;
        cands.push({ km: v, line: String(raw).trim(), sc: sc });
      }
    });
    if (!cands.length) return null;
    var exp = null;
    if (prevKm != null) {
      var days = lastDate ? Math.max(0, diffDays(today, lastDate)) : 0;
      exp = prevKm + (rate || 40) * days;
      var hi = prevKm + Math.max(20000, (rate || 60) * days * 3 + 3000);
      cands = cands.filter(function (c) { return c.km >= prevKm && c.km <= hi; });
      if (!cands.length) return null;
      cands.forEach(function (c) { c.sc -= Math.abs(c.km - exp) / 2000; });
    } else cands.forEach(function (c) { c.sc += c.km >= 1000 ? 1 : 0; });
    cands.sort(function (a, b) { return b.sc - a.sc || b.km - a.km; });
    var uniq = [];
    cands.forEach(function (c) { if (!uniq.some(function (u) { return u.km === c.km; })) uniq.push(c); });
    return { km: uniq[0].km, line: uniq[0].line, alts: uniq.slice(1, 4).map(function (c) { return c.km; }) };
  }

  // 검색: 이름·메모·산 곳·보관 위치, 초성(ㅇㅇ → 우유)도
  var CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
  function cho(str) { return String(str || '').replace(/[가-힣]/g, function (c) { return CHO[Math.floor((c.charCodeAt(0) - 0xAC00) / 588)]; }); }
  function matchSearch(it, q) {
    q = String(q || '').replace(/\s/g, '').toLowerCase();
    if (!q) return false;

  function norm(s) { return String(s).replace(/\s/g, ''); }

  // 등록한 음식 이름 → 해당하는 재료들
  function ingredientsOf(name) {
    var n = norm(name), out = [];
    Object.keys(INGR).forEach(function (k) {
      var hit = INGR[k].some(function (w) { return typeof w === 'string' ? n.indexOf(w) >= 0 : w.test(n); });
      if (k === '햄' && /햄버거/.test(n)) hit = false;
      if (k === '떡' && /떡갈비/.test(n)) hit = false;
      if (k === '오징어' && /오징어채/.test(n)) hit = false;
      if (k === '소면' && /칼국수/.test(n) && !/소면/.test(n)) hit = false;
      if (hit) out.push(k);
    });
    return out;
  }

  // items: 등록한 음식들. 오늘 기준 남은 날짜로 급한 재료를 먼저 쓰는 요리를 위로.
  function recommend(items, today, opts) {
    opts = opts || {};
    var own = {}; // 재료 → [{it, left}]
    items.forEach(function (it) {
      if (it.cat !== 'food') return;
      var left = G.diffDays(G.itemDue(it), today);
      if (left < -2) return; // 이미 많이 지난 건 쓰지 않음
      ingredientsOf(it.name).forEach(function (k) { (own[k] = own[k] || []).push({ it: it, left: left }); });
    });
    var out = RECIPES.map(function (r) {
      var have = [], missing = [], extra = [], urgent = [];
      r.need.forEach(function (k) { (own[k] ? have : missing).push(k); });

        S.items.push(it); persist(); askNotifyOnce(); lb.disabled = true; render();
        toast('남은 ' + r.name + ' 넣었어요 · ' + fullDate(G.itemDue(it)) + '까지 드세요' + (lhm && lhm.freeze ? ' (냉동하면 약 ' + cycleText(lhm.freeze) + ')' : ''), 3200);
      };

        S.items = S.items.filter(function (it) { return ids.indexOf(it.id) < 0; });

    });
  }

  // ── 장보기 목록 ──
  function addShop(name, cat, from, itemId, note) {
    var key = String(name).replace(/\s/g, '');
    if (S.shop.some(function (x) { return !x.done && String(x.name).replace(/\s/g, '') === key; })) return false;
    var o = { id: uid(), name: name, cat: cat || 'food', from: from || 'manual', itemId: itemId || null, at: today() };
    if (note) o.note = note;
    S.shop.push(o);
    persist(); return true;
  }
  // 내 가격 기록에서 가장 싸게 산 가게
  function bestStore(name) {
    var key = G.compareKey(name), best = null;
    S.prices.forEach(function (r) {
      if (!r.store || (r.key || G.compareKey(r.name)) !== key) return;
      var u = G.unitPrice(r.price, r.amt, r.unit, r.qty);
      var v = u ? u.per : null;
      if (!best || (v != null && (best.v == null || v < best.v))) best = { store: r.store, v: v, label: u ? '최저 ' + u.label + ' ' + won(u.per) + '원' : '' };
    });
    if (!best) { var t = S.tpl[name]; if (t && t.store) best = { store: t.store, v: null, label: '' }; }
    return best;
  }
  function shopGroups(list) {
    var g = {}, order = [];
    list.forEach(function (x) {
      var b = bestStore(x.name), k = b ? b.store : '';
      if (!g[k]) { g[k] = { store: k, items: [] }; order.push(k); }
      g[k].items.push({ x: x, b: b });
    });
    return order.map(function (k) { return g[k]; }).sort(function (a, b) { return !a.store ? 1 : !b.store ? -1 : b.items.length - a.items.length; });
  }
  // 다 떨어질 날 예측 (산 날짜 간격)
  function runoutSoon(within) {
    var t = today(), active = {};
    S.items.forEach(function (i) { active[i.name] = 1; });
    return Object.keys(S.tpl).map(function (k) { return S.tpl[k]; })
      .filter(function (tp) { return tp.cat !== 'clothes' && isOn(tp.cat) && !active[tp.name]; })
      .map(function (tp) { return { t: tp, r: G.runout(tp.hist, t) }; })
      .filter(function (x) { return x.r && x.r.left <= within && x.r.left >= -10; })
      .sort(function (a, b) { return a.r.left - b.r.left; });
  }
  function autoRunout() {
    var n = [];
    runoutSoon(2).forEach(function (x) {
      if (x.t.autoNext === x.r.next) return;
      x.t.autoNext = x.r.next;
      if (addShop(x.t.name, x.t.cat, 'runout', null, '보통 ' + x.r.avg + '일마다 사요')) n.push(x.t.name);
    });
    if (n.length) { persist(); toast('곧 떨어질 ' + n.slice(0, 2).join(', ') + (n.length > 2 ? ' 외 ' + (n.length - 2) + '개' : '') + '를 장보기에 담았어요', 3200); }
  }
  function openShop() {
    var t = today();
    var inList = {}; S.shop.forEach(function (x) { if (x.itemId) inList[x.itemId] = 1; inList[String(x.name).replace(/\s/g, '')] = 1; });
    var sug = G.dueToday(S.items, t, S.car).filter(function (x) { return x.it.cat !== 'car' && x.it.cat !== 'dday' && isOn(x.it.cat) && !inList[x.it.id] && !inList[String(x.it.name).replace(/\s/g, '')]; });
    var list = S.shop.filter(function (x) { return !x.done; });
    var soonOut = runoutSoon(7).filter(function (x) { return !inList[String(x.t.name).replace(/\s/g, '')]; });
    var h = '<h2>장보기 목록<button data-x>닫기</button></h2>';
    h += '<div class="row" style="margin-bottom:12px"><input class="inp" id="sh-new" placeholder="살 것 직접 적기 (예: 휴지)"><button class="btn pri" id="sh-add" style="flex:none">담기</button></div>';
    var groups = shopGroups(list);
    if (list.length) {
      h += groups.map(function (g) {
        return (groups.length > 1 || g.store ? '<p class="shop-g">' + (g.store ? esc(g.store) + '에서 <small>' + g.items.length + '개 · 내 기록에서 가장 싼 곳</small>' : '어디서든 <small>' + g.items.length + '개</small>') + '</p>' : '') +
          '<div class="used">' + g.items.map(function (y) {
            var x = y.x;
            var from = x.from && x.from.indexOf('recipe:') === 0 ? x.from.slice(7) + ' 재료' : x.from === 'item' || x.from === 'due' ? '바꿀 때 됨' : x.from === 'fav' ? '자주 쓰는 물품' : x.from === 'runout' ? (x.note || '곧 떨어짐') : '';
            if (y.b && y.b.label) from = (from ? from + ' · ' : '') + y.b.label;
            return '<div class="urow"><input type="checkbox" data-buy="' + x.id + '" aria-label="' + esc(x.name) + ' 샀어요"><span>' + esc(x.name) + (from ? ' <small class="hint" style="display:inline">· ' + esc(from) + '</small>' : '') + '</span><button class="clink" data-shdel="' + x.id + '" style="margin:0">빼기</button></div>';
          }).join('') + '</div>';
      }).join('') + '<p class="hint">산 것을 체크하면 바로 등록할 수 있게 열어드려요. 칫솔처럼 주기로 바꾸는 물건은 "오늘 바꿈"으로 바로 기록돼요.</p>';
      h += '<div class="actions" style="margin-top:10px"><button class="btn full" id="sh-copy">목록 복사해서 보내기</button></div>';
    } else h += '<p class="hint" style="margin:4px 2px 12px">비어 있어요. 아래 추천에서 담거나 직접 적어 보세요.</p>';
    if (soonOut.length) {
      h += '<p class="lbl" style="margin-top:16px">곧 떨어질 것 <span style="font-weight:400">· 산 간격으로 예상했어요</span></p><div class="used">' + soonOut.slice(0, 8).map(function (x) {
        return '<div class="urow"><span>' + esc(x.t.name) + ' <small class="hint" style="display:inline">· 보통 ' + x.r.avg + '일마다 · ' + (x.r.left > 0 ? x.r.left + '일 뒤' : '지금') + '</small></span><button class="btn soft" data-shout="' + esc(x.t.name) + '" style="padding:6px 10px;flex:none">담기</button></div>';
      }).join('') + '</div>';
    }
    if (sug.length) {
      h += '<p class="lbl" style="margin-top:16px">곧 다시 살 것</p><div class="used">' + sug.slice(0, 10).map(function (x) {
        return '<div class="urow"><span>' + esc(x.it.name) + ' <small class="hint" style="display:inline">· ' + x.s.label + '</small></span><button class="btn soft" data-shsug="' + x.it.id + '" style="padding:6px 10px;flex:none">담기</button></div>';
      }).join('') + '</div>';
    }
    openSheet(h, function (el) {
      $('#sh-add', el).onclick = function () { var v = $('#sh-new', el).value.trim(); if (!v) return; var g = G.guess(v); addShop(v, g ? g.cat : 'food', 'manual'); render(); openShop(); };
      $('#sh-new', el).onkeydown = function (e) { if (e.key === 'Enter') $('#sh-add', el).click(); };
      $$('[data-shsug]', el).forEach(function (b) { b.onclick = function () { var it = S.items.filter(function (i) { return i.id === b.dataset.shsug; })[0]; if (it) addShop(it.name, it.cat, 'due', it.id); render(); openShop(); }; });
      $$('[data-shout]', el).forEach(function (b) { b.onclick = function () { var tp = S.tpl[b.dataset.shout]; var r = tp && G.runout(tp.hist, today()); addShop(b.dataset.shout, tp ? tp.cat : 'food', 'runout', null, r ? '보통 ' + r.avg + '일마다 사요' : ''); render(); openShop(); }; });
      $$('[data-shdel]', el).forEach(function (b) { b.onclick = function () { S.shop = S.shop.filter(function (x) { return x.id !== b.dataset.shdel; }); persist(); render(); openShop(); }; });
      $$('[data-buy]', el).forEach(function (c) { c.onchange = function () { bought(c.dataset.buy); }; });
      var cp = $('#sh-copy', el); if (cp) cp.onclick = function () {
        var txt = '[장보기]' + groups.map(function (g) { return '\n' + (groups.length > 1 || g.store ? '\n[' + (g.store || '어디서든') + ']\n' : '') + g.items.map(function (y) { return '□ ' + y.x.name; }).join('\n'); }).join('');
        if (A && A.copy) { A.copy(txt); toast('복사했어요. 카톡에 붙여넣어 보내세요.'); }
        else if (navigator.clipboard) navigator.clipboard.writeText(txt).then(function () { toast('복사했어요'); }, function () { showText('장보기 목록', txt); });
        else showText('장보기 목록', txt);
      };
    });
  }
  function bought(id) {
    var x = S.shop.filter(function (y) { return y.id === id; })[0]; if (!x) return;
    S.shop = S.shop.filter(function (y) { return y !== x; });
    var it = x.itemId ? S.items.filter(function (i) { return i.id === x.itemId; })[0] : null;
    persist(); closeSheet(true);
    if (it && it.mode === 'cycle' && it.cat !== 'food') {
      logEvent(it, 'replace'); it.start = today(); persist(); render();
      toast(it.name + ' 오늘 바꾼 걸로 기록했어요 · 다음 ' + fullDate(G.itemDue(it))); return;
    }
    var t = S.tpl[x.name];
    var d = newDraft(it ? it.cat : (t ? t.cat : x.cat || 'food'));
    var p = G.presetByName(x.name) || G.guess(x.name);
    if (p) applyPreset(d, p.name ? p : { name: x.name, cat: p.cat, mode: p.mode, loc: p.loc, est: p.est });
    d.name = it ? it.name : x.name;
    if (it) { d.loc = it.loc; d.kind = it.kind || d.kind; d.price = it.price; }
    if (t && t.shelf && d.mode === 'expiry') d.dueGuess = G.addDays(today(), t.shelf);
    render(); openForm(d);
    toast('샀어요! 날짜를 넣고 등록해 주세요');
  }

    else if (cat === 'daily') b = [['barcode', IC.barcode, '바코드'], ['receipt', IC.receipt, '영수증'], ['add', IC.pen, '직접 입력']];

      ? [['receipt', IC.receipt, '영수증 찍기', '장 본 음식을 한 번에 등록해요'], ['voice', IC.mic, '말로 등록', '"우유 두 개 이마트 오천 원"처럼 말해요'], ['made', IC.chef, '직접 만든 음식·남은 음식', '동그랑땡·반찬·찌개 · 며칠 안에 먹기'], ['barcode', IC.barcode, '바코드 찍기', '상품 이름을 자동으로 채워요'], ['add', IC.pen, '직접 입력', '포장지 날짜를 찍어서 넣을 수도 있어요']]
      : [['barcode', IC.barcode, '바코드 찍기', '상품 이름을 자동으로 채워요'], ['voice', IC.mic, '말로 등록', '"휴지 30롤 쿠팡 만 팔천 원"처럼 말해요'], ['receipt', IC.receipt, '영수증 찍기', '산 물건을 한 번에 등록해요'], ['add', IC.pen, '직접 입력', '자주 쓰는 품목에서 골라요']];
    openSheet('<h2>' + TITLES[cat] + ' 등록</h2>' + favPicker(cat) + '<div class="menu">' + opts.map(function (o) {

    }).join('') + '</div>' + (favsOf(cat).length ? '' : '<p class="hint center" style="margin-top:12px">자주 사는 물건은 ★ 자주 쓰는 물품에 넣어 두면 여기서 한 번에 등록돼요.</p>'), function (el) {
      bindFavPicker(el);
      $$('[data-m]', el).forEach(function (b) { b.onclick = function () { closeSheet(true); doAct(b.dataset.m); }; });

  function doAct(a) {
    var cat = CAT_TABS.indexOf(view) >= 0 ? view : 'food';
    if (cat === 'car') { if (a === 'car-setup') carSetup(); else openCarForm(newCarDraft()); return; }
    if (a === 'add') openForm(newDraft(cat));
    else if (a === 'barcode') startBarcode(newDraft(cat), true);
    else if (a === 'receipt') startOcr('receipt', null);

  }

  // ── 등록·수정 폼 (음식·옷·생필품) ──
  function newDraft(cat) {
    cat = cat || 'food';
    var d = { cat: cat, mode: cat === 'food' ? 'expiry' : 'cycle', kind: '유통기한', name: '', due: '', start: today(), days: 90, loc: G.LOCS[cat][0], alert: cat === 'food' ? 3 : 7 };
    return d;
  }
  function applyPreset(d, p) {
    var t = today();
    d.name = p.name; d.cat = p.cat; d.mode = p.mode; d.loc = p.loc;
    d.preset = p.name;
    d.startLabel = p.startLabel || null;
    if (p.mode === 'cycle') { d.days = p.days; d.start = d.start || t; }
    else if (!d.due && p.est) { d.dueGuess = G.addDays(t, p.est); }
    d.alert = p.cat === 'food' ? 3 : 7;
    if (p.days && p.days <= 7) d.alert = 1;
  }
  function unitOf(n) { return n % 365 === 0 ? 365 : n % 30 === 0 ? 30 : n % 7 === 0 ? 7 : 1; }

  // ── 가격·구매처·단가 ──
  function won(x) { return x < 10 ? (Math.round(x * 10) / 10).toString() : num(x); }
  function storeList() {
    var c = {};
    (S.set.stores || []).forEach(function (x, i) { c[x] = (c[x] || 0) + 100 - i; });
    S.prices.forEach(function (r) { if (r.store) c[r.store] = (c[r.store] || 0) + 1; });
    return Object.keys(c).sort(function (a, b) { return c[b] - c[a]; });
  }
  function rememberStore(st) {
    var l = (S.set.stores || []).filter(function (x) { return x !== st; });
    l.unshift(st); S.set.stores = l.slice(0, 12);
  }
  var UNITS = [['g', 1, 'g'], ['kg', 1000, 'g'], ['ml', 1, 'ml'], ['L', 1000, 'ml'], ['개', 1, '개']];
  function unitConv(v, u) { for (var i = 0; i < UNITS.length; i++) if (UNITS[i][0] === u) return { amt: v * UNITS[i][1], unit: UNITS[i][2] }; return null; }
  function showAmt(amt, unit) {
    if (unit === 'g' && amt >= 1000 && amt % 100 === 0) return { v: amt / 1000, u: 'kg' };
    if (unit === 'ml' && amt >= 1000 && amt % 100 === 0) return { v: amt / 1000, u: 'L' };
    return { v: amt, u: unit };
  }
  function amtText(amt, unit) { var a = showAmt(amt, unit); return a.v + a.u; }
  function priceSection(d) {
    var auto = !d.amt && !d.amtTouched ? G.parseAmount(d.name) : null;
    var a = d.amt ? showAmt(d.amt, d.unit) : auto ? showAmt(auto.amt, auto.unit) : { v: '', u: 'g' };
    var open = d.price || d.store || d.openPrice;
    var stores = storeList().slice(0, 8);
    return '<details class="pbox field" id="f-pbox"' + (open ? ' open' : '') + '><summary><span><b>가격·구매처</b> <small>(선택 · 어디가 더 싼지 비교해 드려요)</small></span>' + IC.down + '</summary>' +
      '<div class="row"><input class="inp" id="f-price" type="number" inputmode="numeric" placeholder="낸 돈 (예: 2980)" value="' + (d.price || '') + '"><span style="flex:none">원</span></div>' +
      '<div class="row" style="margin-top:8px"><input class="inp" id="f-amt" type="number" inputmode="decimal" placeholder="용량·무게·개수" value="' + a.v + '"><select class="inp" id="f-u2" style="width:86px;flex:none">' +
      UNITS.map(function (x) { return '<option' + (x[0] === a.u ? ' selected' : '') + '>' + x[0] + '</option>'; }).join('') + '</select></div>' +
      '<p class="hint" id="f-auto">' + (auto ? '이름에서 ' + amtText(auto.amt, auto.unit) + '을 읽었어요.' : '1L, 600g, 10구처럼 이름에 적으면 자동으로 채워요.') + '</p>' +
      '<input class="inp" id="f-store" placeholder="산 곳 (예: 이마트)" value="' + esc(d.store || '') + '" style="margin-top:4px">' +
      (stores.length ? '<div class="presets" style="margin-top:6px">' + stores.map(function (x) { return '<button class="chip' + (x === d.store ? ' on' : '') + '" data-st2="' + esc(x) + '">' + esc(x) + '</button>'; }).join('') + '</div>' : '') +

  function recordPrice(it, date) {

      return '<div class="cmprow" data-ci="' + i + '"><span class="cl">' + 'ABCDE'[i] + '</span><input class="inp" type="number" inputmode="numeric" data-cf="p" placeholder="가격" value="' + r.p + '"><input class="inp" type="number" inputmode="decimal" data-cf="a" placeholder="용량" value="' + r.a + '">' +

    } else if (it.mode === 'cycle') {
      h += '<button class="btn pri full" data-a="replace">오늘 새 걸로 바꿨어요</button>';
    } else {
      h += '<button class="btn pri full" data-a="renew">새 걸로 바꿨어요</button>';
    }
    h += '</div>';
    var hist = S.events.filter(function (e) { return e.itemId === it.id; }).slice(-6).reverse();
    if (hist.length) {
      h += '<p class="lbl" style="margin-top:14px">지난 기록</p><ul class="hist">' + hist.map(function (e) { return '<li>' + fullDate(e.date) + ' · ' + TYPE_WORD[e.type] + '</li>'; }).join('') + '</ul>';
    }
    var fav = S.fav.indexOf(it.name) >= 0;
    h += '<div class="links"><button data-a="fav" class="' + (fav ? 'faved' : '') + '">' + IC.star + (fav ? '자주 쓰는 물품' : '자주 쓰는 물품에 넣기') + '</button><button data-a="cmp">가격 비교</button></div>';
    h += '<div class="links" style="margin-top:2px"><button data-a="shop">장보기에 담기</button><button data-a="edit">수정</button><button data-a="del">삭제</button></div>';
    openSheet(h, function (el) {
      $$('[data-a]', el).forEach(function (b) {
        b.onclick = function () {
          var a = b.dataset.a;
          if (a === 'edit') { closeSheet(true); openForm(JSON.parse(JSON.stringify(it))); return; }
          if (a === 'shop') { addShop(it.name, it.cat, 'item', it.id); toast('장보기 목록에 담았어요'); render(); return; }
          if (a === 'learn') { it.days = lc.avg; persist(); closeSheet(true); render(); toast('주기를 ' + lc.avg + '일로 바꿨어요 · 다음 교체 ' + fullDate(G.itemDue(it))); return; }
          if (a === 'freeze') { freezeItem(it); return; }
          if (a === 'q-' || a === 'q+') { it.qty = Math.max(1, Math.min(99, qtyOf(it) + (a === 'q+' ? 1 : -1))); if (it.qty === 1) delete it.qty; persist(); render(); openDetail(it.id); return; }
          if (a === 'fav') { toggleFav(it); openDetail(it.id); return; }
          if (a === 'cmp') { closeSheet(true); openCompare(G.compareKey(it.name)); return; }
          if (a === 'del') { delItem(it); return; }
          if (a === 'eaten' || a === 'discard') {
            var share = it.price ? Math.round(it.price / (it.qty0 || qtyOf(it))) : 0;
            logEvent(it, a, a === 'discard' && share ? { price: share } : null);
            if (qtyOf(it) > 1) {
              it.qty--; if (it.qty === 1) delete it.qty;
              persist(); render(); openDetail(it.id);
              toast((a === 'eaten' ? '1개 먹었어요' : '1개 버렸어요') + ' · ' + qtyOf(it) + '개 남았어요');
              return;
            }
            S.items = S.items.filter(function (x) { return x !== it; });
            photoDel(it.id);
            var auto = S.fav.indexOf(it.name) >= 0 && addShop(it.name, it.cat, 'fav');
            persist(); closeSheet(true); render();
            toast((a === 'eaten' ? '잘 드셨어요! 목록에서 뺐어요' : '버린 음식으로 기록했어요') + (auto ? ' · 자주 쓰는 물품이라 장보기에 담았어요' : ''), auto ? 3200 : 2400);
          } else if (a === 'replace') {
            logEvent(it, 'replace');
            it.start = today();
            persist(); closeSheet(true); render();
            toast('다음 교체일은 ' + fullDate(G.itemDue(it)) + '이에요');
          } else if (a === 'renew') {
            logEvent(it, 'replace');
            persist(); closeSheet(true);
            var d = JSON.parse(JSON.stringify(it)); d.due = '';
            d.dateNote = '새 물건의 날짜를 넣어주세요.';
            openForm(d);
          }
        };
      });
    });
  }
  function freezeItem(it) {
    var f = G.freezeInfo(it.name);
    var nd = f.days ? G.addDays(today(), f.days) : G.addDays(today(), 30);
    var msg = f.days ? '냉동실로 옮기면 기한을 ' + fullDate(nd) + '(약 ' + cycleText(f.days) + ')로 바꿔요.' + (f.note ? '\n' + f.note + '.' : '') + '\n대략적인 기준이니 포장지 안내를 먼저 따라주세요.'
      : f.note + '.\n그래도 옮기면 기한을 한 달 뒤로 잡아요.';
    ask(msg, f.days ? '냉동실로 옮기기' : '그래도 옮기기', function () {
      it.loc = '냉동'; it.mode = 'expiry'; it.due = nd; it.kind = '냉동 보관'; it.frozen = today();
      delete it.start; delete it.days;
      persist(); render(); toast('냉동실로 옮겼어요 · ' + stat(it).label);
    });
  }
  function delItem(it) {
    ask('"' + it.name + '"을(를) 목록에서 지울까요?\n통계 기록은 그대로 남아요.', '지우기', function () {
      S.items = S.items.filter(function (x) { return x !== it; });
      photoDel(it.id);
      persist(); render(); toast('지웠어요');
    });
  }

  // ════════ 자동차 ════════
  function carHtml() {
    var t = today(), car = S.car;
    var h = header('car');
    if (car.km == null) {
      h += '<div class="empty"><div class="mascot">' + MASCOT + '</div><div class="big">차를 등록해 주세요</div>지금 주행거리만 넣으면<br>엔진오일·필터·타이어 교체 시기를<br>km와 기간으로 함께 챙겨드려요.' +
        '<div class="btns"><button class="btn pri" data-act="car-setup">' + IC.car + '내 차 등록</button></div></div>';
      return '<div class="wrap">' + h + '</div>';
    }
    var rate = G.kmRate(car), ll = lastLog();
    var ago = ll ? G.diffDays(t, ll.date) : null;
    h += '<div class="carcard"><div class="row" style="justify-content:space-between"><div><div class="cname">' + esc(car.name || '내 차') + '</div>' +
      '<div class="ckm">' + num(car.km) + '<small>km</small></div></div><button class="btn pri" data-car="km">' + IC.gauge + '주행거리 입력</button></div>' +
      '<div class="cmeta">' + (rate ? '하루 평균 ' + num(rate) + 'km · 한 달 약 ' + num(rate * 30) + 'km' : '2주 이상 주행거리를 기록하면 교체 날짜도 예상해 드려요') +
      (ago != null ? ' · ' + (ago === 0 ? '오늘 기록' : ago + '일 전 기록') : '') + '</div>' +
      (ago != null && ago >= 30 ? '<div class="cwarn">주행거리를 기록한 지 한 달이 넘었어요. 계기판 숫자를 넣어주세요.</div>' : '') +
      (function () { var y = t.slice(0, 4), won = S.events.filter(function (e) { return e.cat === 'car' && e.price && e.date.slice(0, 4) === y; }).reduce(function (a, e) { return a + e.price; }, 0);
        return won ? '<div class="cmeta">올해 정비비 <b>' + num(won) + '원</b></div>' : ''; })() +
      '<button class="clink" data-car="edit">차 정보·주행 기록</button></div>';
    var carNames = G.REPEATS.filter(function (p) { return p.g === 'car'; }).map(function (p) { return p.name; });
    if (!S.set.carSug && !S.items.some(function (i) { return i.mode === 'dday' && carNames.indexOf(i.name) >= 0; })) {
      h += '<div class="sugcard"><span class="si">' + IC.wrench + '</span><span><b>보험·자동차세·정기검사도 챙길까요?</b><small>날짜만 넣으면 D-day 탭에서 미리 알려드려요</small></span><div class="row"><button class="btn soft" data-car="dsug">고르기</button><button class="clink" data-car="dsno" style="margin:0">괜찮아요</button></div></div>';
    }
    var all = listOf('car', t);
    if (!all.length) {
      h += '<div class="empty" style="padding-top:20px">관리할 부품이 없어요.<div class="btns"><button class="btn pri" data-car="parts">기본 부품 한 번에 넣기</button><button class="btn" data-act="add">직접 추가</button></div></div>';
      return '<div class="wrap">' + h + '</div>';
    }
    h += summary(all);
    var rows = all.filter(function (x) { return !stF || x.s.state === stF; });
    h += rows.length ? rowsHtml(rows, t) : '<div class="empty">조건에 맞는 부품이 없어요.</div>';
    h += '<p class="hint center">교체 주기는 일반적인 권장값이에요. 차량 취급설명서나 정비소 안내에 맞춰 바꿔주세요.<br>km와 기간 중 먼저 오는 쪽으로 알려드려요.</p>';
    return '<div class="wrap">' + h + '</div>';
  }

  function carSetup() {
    var car = S.car;
    openSheet('<h2>내 차 등록<button data-x>닫기</button></h2>' +
      '<div class="field"><label for="c-name">차 이름</label><input class="inp" id="c-name" value="' + esc(car.name || '내 차') + '" placeholder="예: 아반떼"></div>' +
      '<div class="field"><label for="c-km">지금 주행거리 (계기판 숫자)</label><div class="row"><input class="inp" id="c-km" type="number" inputmode="numeric" placeholder="예: 52000" value="' + (car.km == null ? '' : car.km) + '"><span>km</span></div></div>' +
      '<button class="btn pri block" id="c-go">다음</button>', function (el) {
      $('#c-go', el).onclick = function () {
        var km = +$('#c-km', el).value;
        if (!$('#c-km', el).value || km < 0) { toast('주행거리를 넣어주세요'); return; }
        car.name = $('#c-name', el).value.trim() || '내 차';
        setKm(km, today());
        persist(); closeSheet(true); render();
        partsSetup();
      };
    });
  }

  function setKm(km, date) {
    var car = S.car;
    car.log = (car.log || []).filter(function (l) { return l.date !== date; });
    car.log.push({ date: date, km: km });
    car.log.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    var ll = lastLog();
    car.km = ll ? ll.km : km;
  }

  var COMMON = ['엔진오일', '에어컨 필터', '와이퍼', '타이어 위치교환', '엔진 에어필터'];
  function partsSetup() {
    var have = {}; S.items.forEach(function (i) { if (i.cat === 'car') have[i.name] = 1; });
    var ps = G.PRESETS.filter(function (p) { return p.cat === 'car' && !have[p.name]; });
    if (!ps.length) { toast('기본 부품이 모두 들어 있어요'); return; }
    var t = today(), km = S.car.km;
    var h = '<h2>관리할 부품 고르기<button data-x>닫기</button></h2><p class="hint" style="margin:-6px 2px 12px">마지막으로 바꾼 날짜와 km를 넣어주세요. 모르면 그대로 두면 <b>오늘부터</b> 계산해요.</p>';
    h += ps.map(function (p, i) {
      var on = COMMON.indexOf(p.name) >= 0;
      return '<div class="rc' + (on ? '' : ' off') + '" data-i="' + i + '"><input type="checkbox"' + (on ? ' checked' : '') + '><div class="mid"><b>' + esc(p.name) + '</b> <span class="hint" style="display:inline">' + intervalText(p.km, p.days) + '</span>' +
        '<div class="sub"><span>마지막 교체</span><input type="date" data-f="d" value="' + t + '"><input type="number" inputmode="numeric" data-f="k" value="' + km + '" style="width:92px"><span>km</span></div></div></div>';
    }).join('');
    h += '<button class="btn pri block" id="ps-go" style="margin-top:12px">체크한 부품 넣기</button>';
    openSheet(h, function (el) {
      $$('.rc input[type=checkbox]', el).forEach(function (c) { c.onchange = function () { c.closest('.rc').classList.toggle('off', !c.checked); }; });
      $('#ps-go', el).onclick = function () {
        var n = 0;
        $$('.rc', el).forEach(function (rc) {
          if (!$('input[type=checkbox]', rc).checked) return;
          var p = ps[+rc.dataset.i];
          S.items.push({ id: uid(), created: t, name: p.name, cat: 'car', mode: 'car', intKm: p.km, intDays: p.days, lastDate: $('[data-f=d]', rc).value || t, lastKm: +$('[data-f=k]', rc).value || km, alert: 30, alertKm: 1000 });
          n++;
        });
        persist(); askNotifyOnce(); closeSheet(true); render();
        if (n) toast(n + '개 부품을 넣었어요');
      };
    });
  }

  // 자동차 보험·세금·검사 날짜를 D-day 탭에 한 번에
  function carDdaySetup() {
    var t = today(), ps = G.REPEATS.filter(function (p) { return p.g === 'car'; });
    var h = '<h2>자동차 날짜 챙기기<button data-x>닫기</button></h2><p class="hint" style="margin:-6px 2px 12px">보험 갱신일과 검사일은 보험증권·자동차등록증을 보고 넣어주세요. 자동차세는 6월·12월 말이 기본이에요.</p>';
    h += ps.map(function (p, i) {
      return '<div class="rc" data-i="' + i + '"><input type="checkbox" checked><div class="mid"><b>' + esc(p.name) + '</b> <span class="hint" style="display:inline">' + monthsText(p.months) + '마다</span>' +
        '<div class="sub"><span>다음</span><input type="date" data-f="d" value="' + G.repeatStart(p, t) + '"><input type="number" inputmode="numeric" data-f="p" placeholder="금액(선택)" style="width:110px"></div></div></div>';
    }).join('');
    h += '<button class="btn pri block" id="cd-go" style="margin-top:12px">체크한 것 D-day에 넣기</button>';
    openSheet(h, function (el) {
      $$('.rc input[type=checkbox]', el).forEach(function (c) { c.onchange = function () { c.closest('.rc').classList.toggle('off', !c.checked); }; });
      $('#cd-go', el).onclick = function () {
        var n = 0;
        $$('.rc', el).forEach(function (rc) {
          if (!$('input[type=checkbox]', rc).checked) return;
          var p = ps[+rc.dataset.i], it = { id: uid(), created: t, cat: 'dday', mode: 'dday', kind: 'repeat', name: p.name, date: $('[data-f=d]', rc).value || G.repeatStart(p, t), months: p.months, alert: p.alert || 7 };
          var pr = +$('[data-f=p]', rc).value; if (pr) it.price = pr;

        if (n) toast(n + '개를 D-day 탭에 넣었어요');
      };
    });

  function intervalText(km, days) {
    var a = [];
    if (km) a.push(num(km) + 'km');
    if (days) a.push(cycleText(days));
    return a.length ? a.join(' 또는 ') + '마다' : '주기 없음';
  }

  function newCarDraft() { return { cat: 'car', mode: 'car', name: '', intKm: null, intDays: 180, lastDate: today(), lastKm: S.car.km, alert: 30, alertKm: 1000 }; }

    h += '<div class="field"><span class="lbl">교체 주기 (먼저 오는 쪽)</span><div class="row"><input class="inp" id="p-km" type="number" inputmode="numeric" placeholder="km 없음" value="' + (d.intKm || '') + '"><span style="flex:none">km</span></div>' +

  var VER = { cur: null, latest: null };
  function renderVer() {

    var name = A.version();

    var st = VER.latest == null ? '' : VER.latest > VER.cur ? ' · <span class="new">v1.' + VER.latest + ' 있음</span>' : ' · <span class="ok">최신</span>';
    el.innerHTML = '<b>v' + esc(name) + '</b>' + st;
    el.className = 'ver' + (VER.latest > VER.cur ? ' has-new' : '');
  }
  window.onLatest = function (latest, cur) { VER.latest = +latest; renderVer(); };

  // 알림·위젯 버튼으로 처리한 일을 앱에 반영
  function applyActions() {
    if (!A || !A.takeActions) return;
    var acts = [];
    try { acts = JSON.parse(A.takeActions() || '[]'); } catch (e) { return; }
    if (!acts.length) return;
    var done = 0, shop = 0;
    acts.forEach(function (a) {
      if (a.type === 'done') {
        var it = S.items.filter(function (x) { return x.id === a.id; })[0];
        if (!it) return;
        var ev;
        if (it.cat === 'food') {
          ev = logEvent(it, 'eaten');
          if (qtyOf(it) > 1) { it.qty--; if (it.qty === 1) delete it.qty; }
          else { S.items = S.items.filter(function (x) { return x !== it; }); photoDel(it.id); if (S.fav.indexOf(it.name) >= 0) addShop(it.name, it.cat, 'fav'); }
        } else if (it.mode === 'cycle') { ev = logEvent(it, 'replace'); it.start = a.date || today(); }
        else { ev = logEvent(it, 'replace'); S.items = S.items.filter(function (x) { return x !== it; }); }
        if (ev && a.date) ev.date = a.date;
        done++;
      } else if (a.type === 'use') {
        var su = S.items.filter(function (x) { return x.id === a.id; })[0];
        if (su && /^\d{4}-\d{2}$/.test(a.ym)) { su.use = su.use || {}; su.use[a.ym] = !!a.used; done++; }
      } else if (a.type === 'shop') {
        (a.ids || []).forEach(function (id) { var it = S.items.filter(function (x) { return x.id === id; })[0]; if (it && addShop(it.name, it.cat, 'due', it.id)) shop++; });
      }
    });
    persist(); render();
    var m = [];
    if (done) m.push('알림에서 처리한 ' + done + '개를 기록했어요');
    if (shop) m.push('장보기에 ' + shop + '개 담았어요');
