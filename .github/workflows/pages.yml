# 다운로드·설명서 페이지만 다시 올리기 (앱은 다시 빌드하지 않음): site 폴더를 고치거나 직접 실행할 때
name: 챙김이 다운로드 페이지
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/webapp.py']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# 앱 빌드와 페이지만 올리기가 동시에 돌면 페이지가 예전 버전으로 덮일 수 있어 차례로 실행
concurrency: { group: release, cancel-in-progress: false }
jobs:
  site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: 최신 버전 번호로 페이지 채우기
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          N=$(gh release view --json tagName -q .tagName | tr -dc 0-9)
          MB=$(gh release view --json assets -q '.assets[] | select(.name=="gyoche-check.apk") | .size' | awk '{printf "%d", $1/1048576}')
          # 다운로드 페이지 QR: 바깥 CDN 대신 npm에서 받아 지문(sha256)을 확인한 뒤 같은 사이트에 둠
          (cd "$RUNNER_TEMP" && npm pack qrcode-generator@1.4.4 --silent >/dev/null && tar -xzf qrcode-generator-1.4.4.tgz)
          cp "$RUNNER_TEMP/package/qrcode.js" site/qrcode.js
          echo "18ae399f81182bc9de916e9c77b195df20cc58d6f2d55a62b085a299f1bf1780  site/qrcode.js" | sha256sum -c -
          python3 .github/webapp.py "$N"
          sed -i "s/__N__/$N/g; s/__MB__/$MB/g" site/index.html site/guide.html
      - uses: actions/upload-pages-artifact@v5
        with: { path: site }
  pages:
    needs: site
    runs-on: ubuntu-24.04
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
