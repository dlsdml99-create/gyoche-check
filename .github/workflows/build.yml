          hrLNAB614+cn+QK6iGangje/3dKof0IoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgo
          KCh/LX8DtI9S6wAIDAA=
          EOF_B
      - name: Create project
        run: |
          set -e
          base64 -d app.b64 | tar -xzf -
          ls -R app | head -40
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if gradle assembleRelease --no-daemon; then
            cp app/build/outputs/apk/release/app-release.apk gyoche-check.apk
          else
            echo "::warning::release build failed, using debug build"
            gradle assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk gyoche-check.apk
          fi
          ls -la gyoche-check.apk
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release delete "v${{ github.run_number }}" --yes --cleanup-tag || true
          git push --delete origin "v${{ github.run_number }}" || true
          sed -i "s/__N__/${{ github.run_number }}/g; s/__MB__/$(du -m gyoche-check.apk | cut -f1)/g" notes.md
          gh release create "v${{ github.run_number }}" gyoche-check.apk --latest --title "챙김이 v1.${{ github.run_number }}" --notes-file notes.md
      - name: Build download page
        run: |
          sed -i "s/__N__/${{ github.run_number }}/g; s/__MB__/$(du -m gyoche-check.apk | cut -f1)/g" site/index.html site/guide.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  pages:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
