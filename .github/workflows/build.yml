# [챙김이용] build.yml - dlsdml99-create/gyoche-check 저장소에만 올리세요 (N빵 저장소 X)
name: 챙김이 APK 만들기
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'site/**', '.github/**']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
# 앱 빌드와 페이지만 올리기가 동시에 돌면 페이지가 예전 버전으로 덮일 수 있어 차례로 실행
concurrency: { group: release, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 저장소 확인
        run: |
          if [ "${{ github.repository }}" != "dlsdml99-create/gyoche-check" ]; then
            echo "::error::이 build.yml은 챙김이(gyoche-check) 저장소용이에요. 다른 앱 저장소에는 그 앱용 build.yml을 올려주세요."
            exit 1
          fi
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'
      - name: Build APK
        env:
          RUN_NUMBER: ${{ github.run_number }}
          SIGNING: ${{ secrets.GYOCHE_SIGNING }}
          KEY2: ${{ secrets.GYOCHE_KEY2 }}
        run: |
          if [ -z "$SIGNING" ]; then
            echo "::error::서명 키 비밀값(GYOCHE_SIGNING)이 없어요. 저장소 Settings - Secrets and variables - Actions 에서 New repository secret 으로 넣어주세요."
            exit 1
          fi
          export KEY_PASS="${SIGNING%%:*}"
          # 보안: 비밀번호가 혹시라도 로그에 찍히면 가려지게
          echo "::add-mask::$KEY_PASS"
          [ -n "$KEY2" ] && echo "::add-mask::$KEY2"
          # 보안: 예전 키는 옛 커밋에 공개돼 있어, 새 키(GYOCHE_KEY2) 없이 예전 키로만 서명해 배포하지 않음
          if [ -z "$KEY2" ] || [ ${#KEY2} -lt 16 ]; then
            echo "::error::새 서명 키 비밀번호(GYOCHE_KEY2)가 없거나 16글자보다 짧아서 빌드를 멈췄어요. 예전 키로만 서명하면 안전하지 않아요. 저장소 Settings - Secrets and variables - Actions 에서 GYOCHE_KEY2 를 16글자 이상으로 넣어 주세요 (이미 넣었다면 지우지 말고 그대로 두세요)."
            exit 1
          fi
          echo "${SIGNING#*:}" | base64 -d > app/gyoche.jks
          # 보안: 배포용(release) 빌드만 올림. 실패하면 디버그 빌드(내부를 들여다볼 수 있음)로 대신하지 않고 멈춤
          trap 'rm -f app/gyoche.jks' EXIT
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk gyoche-check.apk
          # 보안: 예전 서명 키가 옛 커밋에 공개돼 있어 새 키로 넘어감(키 교체, 앱 지우지 않고 업데이트 가능)
          # 새 키는 app/gyoche2.jks.enc 에 암호화돼 있고, 비밀번호는 GitHub 비밀값 GYOCHE_KEY2 에만 있음
          if [ -n "$KEY2" ]; then
            BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
            printf '%s' "$KEY2" > "$RUNNER_TEMP/k2"
            # 키 도구는 영어·숫자 암호만 받아서, 정한 암호(한글 가능)를 SHA-256으로 바꿔 키 암호로 씀
            printf '%s' "$KEY2" | sha256sum | cut -c1-64 > "$RUNNER_TEMP/kp"
            trap 'rm -f app/gyoche.jks "$RUNNER_TEMP/k2" "$RUNNER_TEMP/kp" "$RUNNER_TEMP/new.jks"' EXIT
            # 처음 한 번: 새 키를 GitHub 안에서 만들고(아무도 못 봄), 비밀번호로 암호화해 저장소에 보관
            if [ ! -f app/gyoche2.jks.enc ]; then
              keytool -genkeypair -keystore "$RUNNER_TEMP/new.jks" -storetype PKCS12 -alias gyoche2 -keyalg RSA -keysize 4096 -validity 36500 \
                -storepass:file "$RUNNER_TEMP/kp" -keypass:file "$RUNNER_TEMP/kp" -dname "CN=Gyoche Check, O=dlsdml99-create"
              openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -in "$RUNNER_TEMP/new.jks" -out app/gyoche2.jks.enc -pass file:"$RUNNER_TEMP/k2"
              rm -f "$RUNNER_TEMP/new.jks"
              git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add app/gyoche2.jks.enc && git commit -q -m "새 서명 키(암호화됨) 보관 [skip ci]" && git pull -q --rebase origin main && git push -q origin HEAD:main
            fi
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in app/gyoche2.jks.enc -out "$RUNNER_TEMP/new.jks" -pass file:"$RUNNER_TEMP/k2" \
              || { echo "::error::GYOCHE_KEY2 비밀번호가 맞지 않아요."; exit 1; }
            "$BT/apksigner" rotate --out "$RUNNER_TEMP/lineage" \
              --old-signer --ks app/gyoche.jks --ks-key-alias gyoche --ks-pass env:KEY_PASS --set-rollback false \
              --new-signer --ks "$RUNNER_TEMP/new.jks" --ks-key-alias gyoche2 --ks-pass file:"$RUNNER_TEMP/kp"
            "$BT/apksigner" sign --lineage "$RUNNER_TEMP/lineage" --rotation-min-sdk-version 28 \
              --ks app/gyoche.jks --ks-key-alias gyoche --ks-pass env:KEY_PASS \
              --next-signer --ks "$RUNNER_TEMP/new.jks" --ks-key-alias gyoche2 --ks-pass file:"$RUNNER_TEMP/kp" \
              gyoche-check.apk
            "$BT/apksigner" verify -v --print-certs gyoche-check.apk | grep -E "Verified|SHA-256|lineage" || true
          else
            echo "::error::새 서명 키로 서명하지 못했어요."; exit 1
          fi
          ls -la gyoche-check.apk
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release delete "v${{ github.run_number }}" --yes --cleanup-tag || true
          git push --delete origin "v${{ github.run_number }}" || true
          sed -i "s/__N__/${{ github.run_number }}/g; s/__MB__/$(du -m gyoche-check.apk | cut -f1)/g" notes.md
          gh release create "v${{ github.run_number }}" gyoche-check.apk --latest --title "챙김이 v1.${{ github.run_number }}" --notes-file notes.md
      - name: Build download page
        run: |
          # 다운로드 페이지 QR: 바깥 CDN 대신 npm에서 받아 지문(sha256)을 확인한 뒤 같은 사이트에 둠
          (cd "$RUNNER_TEMP" && npm pack qrcode-generator@1.4.4 --silent >/dev/null && tar -xzf qrcode-generator-1.4.4.tgz)
          cp "$RUNNER_TEMP/package/qrcode.js" site/qrcode.js
          echo "18ae399f81182bc9de916e9c77b195df20cc58d6f2d55a62b085a299f1bf1780  site/qrcode.js" | sha256sum -c -
          python3 .github/webapp.py "${{ github.run_number }}"
          sed -i "s/__N__/${{ github.run_number }}/g; s/__MB__/$(du -m gyoche-check.apk | cut -f1)/g" site/index.html site/guide.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  pages:
    needs: build
    runs-on: ubuntu-24.04
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
