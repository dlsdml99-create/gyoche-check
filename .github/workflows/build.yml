      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle assembleDebug --no-daemon
        env:
          RUN_NUMBER: ${{ github.run_number }}
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk gyoche-check.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create "v${{ github.run_number }}" gyoche-check.apk --latest --title "챙김이 v1.${{ github.run_number }}" --notes "폰에서 gyoche-check.apk를 눌러 받아 설치하세요."
