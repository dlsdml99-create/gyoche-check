# [챙김이용] build.yml - dlsdml99-create/gyoche-check 저장소에만 올리세요 (N빵 저장소 X)
name: 챙김이 APK 만들기
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 저장소 확인
        run: |
          if [ "${{ github.repository }}" != "dlsdml99-create/gyoche-check" ]; then
            echo "::error::이 build.yml은 챙김이(gyoche-check) 저장소용이에요. 다른 앱 저장소에는 그 앱용 build.yml을 올려주세요."
            exit 1
          fi
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'
      - name: Build APK
        env:
          RUN_NUMBER: ${{ github.run_number }}
          SIGNING: ${{ secrets.GYOCHE_SIGNING }}
        run: |
          if [ -z "$SIGNING" ]; then
            echo "::error::서명 키 비밀값(GYOCHE_SIGNING)이 없어요. 저장소 Settings - Secrets and variables - Actions 에서 New repository secret 으로 넣어주세요."
            exit 1
          fi
          export KEY_PASS="${SIGNING%%:*}"
          echo "${SIGNING#*:}" | base64 -d > app/gyoche.jks
          if gradle assembleRelease --no-daemon; then
            cp app/build/outputs/apk/release/app-release.apk gyoche-check.apk
          else
            echo "::warning::release build failed, using debug build"
            gradle assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk gyoche-check.apk
          fi
          rm -f app/gyoche.jks
          ls -la gyoche-check.apk
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release delete "v${{ github.run_number }}" --yes --cleanup-tag || true
          git push --delete origin "v${{ github.run_number }}" || true
          sed -i "s/__N__/${{ github.run_number }}/g; s/__MB__/$(du -m gyoche-check.apk | cut -f1)/g" notes.md
          gh release create "v${{ github.run_number }}" gyoche-check.apk --latest --title "챙김이 v1.${{ github.run_number }}" --notes-file notes.md
      - name: Build download page
        run: |
          sed -i "s/__N__/${{ github.run_number }}/g; s/__MB__/$(du -m gyoche-check.apk | cut -f1)/g" site/index.html site/guide.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  pages:
    needs: build
    runs-on: ubuntu-24.04
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
